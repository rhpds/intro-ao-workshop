---
# What each scenario is MISSING when it lands in the student's `default`
# project. Declarative on purpose: the student copies are generated from
# the same exports `solutions` uses, so a fix to a prompt or a node is
# picked up by both. Forking the JSON would have meant the student copy
# silently missing every correction made to the real one.
#
# Keyed by the workflow `key` in ..._config_workflows.

ao_student_gaps:

  # Build the >95% branch off the switch. One branch, not two.
  #
  # The 80-95% branch is left intact on purpose, and it is the close
  # worked example: remediate then notify, the same two-node shape the
  # student is asked to build, sitting on the same canvas one port
  # above. They are copying a pattern they can see rather than working
  # from a description. <80% and default stay too, so three of the four
  # ports are wired and only one is obviously empty.
  disk_utilization:
    summary: >-
      The >95% branch is missing. Build it, using the 80-95% branch
      beside it as the model.
    drop_nodes:
      - activity_e18d67ef_1f99_4553_9807_81710484a424   # Remediate - Expand Disk
      - activity_e31726ba_d2bc_41c2_96e0_3d00c4a175cf   # Critical - Notify Chatroom - Expand Disk

  # Fill in the routing conditions.
  #
  # Ports and labels stay, so the student can see there are three routes
  # and what each is for; only the expression that selects them is gone.
  # In the UI this is the field / operator / value row.
  rhel_cve_remediation:
    summary: >-
      The Route Decision switch has its routes but no conditions. Fill
      them in.
    blank_switch_conditions:
      - route_switch

  # Two gaps, both on things the student made or was given.
  #
  # The trigger ships with no authorized service account, which is what
  # makes the workflow import but refuse to publish -- confirmed
  # 2026-10-08: HTTP 201, is_valid false,
  # "'authorized_service_account_ids' is a required property". The
  # account itself already exists in `default` as `aap-student-webhooks`;
  # the student selects it, they do not create it.
  #
  # The triage agent ships as NONE rather than SELECTED-with-no-tools,
  # because AO rejects an empty SELECTED list outright ("[] should be
  # non-empty") and that would make the workflow invalid for a reason
  # the student is not being asked to fix.
  ticket_enrichment:
    summary: >-
      The webhook trigger has no authorized service account, and the
      triage agent selects no tools.
    unauthorized_trigger: true
    agent_tools_none:
      - triage_agent
