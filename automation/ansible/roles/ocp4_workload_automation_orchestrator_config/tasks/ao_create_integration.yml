---
# Create one integration, associate it with the solutions project,
# refresh it, and poll until it exposes models or tools.
#
# Inputs:
#   _int_key           — key into _ao_integration_ids
#   _int_name          — display name
#   _int_type          — llm_provider | ansible_automation_platform
#                        | mcp_server
#   _int_configuration — type-specific configuration dict, which must
#                        itself repeat integration_type

#   _int_credential    — optional key into _ao_credential_ids

- name: "Create integration: {{ _int_name }}"
  ansible.builtin.include_tasks: ao_find_or_create.yml
  vars:
    _fc_kind: integrations
    _fc_name: "{{ _int_name }}"
    _fc_body: >-
      {{
        {
          'name': _int_name,
          'integration_type': _int_type,
          'scope': 'project',
          'configuration': _int_configuration,
        }
        | combine(
            {'management_credential_id': _ao_credential_ids[_int_credential]}
            if _int_credential is defined else {}
          )
      }}
    _fc_patch: >-
      {{
        {'configuration': _int_configuration}
        | combine(
            {'management_credential_id': _ao_credential_ids[_int_credential]}
            if _int_credential is defined else {}
          )
      }}

- name: "Record integration id: {{ _int_name }}"
  ansible.builtin.set_fact:
    _ao_integration_ids: "{{ _ao_integration_ids | combine({_int_key: _ao_object_id}) }}"
    _int_id: "{{ _ao_object_id }}"

- name: "List projects already associated with {{ _int_name }}"
  ansible.builtin.uri:
    url: "{{ _ao_api }}/integrations/{{ _int_id }}/projects?limit={{ _ao_collection_page_size }}"
    method: GET
    headers: "{{ _ao_headers }}"
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_int_projects

- name: "Associate with the solutions project: {{ _int_name }}"
  # This endpoint returns `project_id`/`project_name`, not `id`/`name`
  # like every other collection — matching on `id` would silently
  # never find the association and re-POST on every run.
  when: >-
    _ao_project_id not in
    (r_int_projects.json | intro_ao_workshop.automation.ao_collection | map(attribute='project_id') | list)
  ansible.builtin.uri:
    url: "{{ _ao_api }}/integrations/{{ _int_id }}/projects/{{ _ao_project_id }}"
    method: POST
    headers: "{{ _ao_headers }}"
    status_code: [200, 201, 204]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"

- name: "Validate integration: {{ _int_name }}"
  # Separate from /refresh, and not optional. A new integration is
  # created at validation_status 'unknown' and stays there: measured,
  # a refresh that synced all 140 of AAP MCP's tools left the status
  # untouched 20 s later. Only this call moves it, and it is what the
  # UI's "Validate" button fires. Without it every integration this
  # role creates reads as unchecked next to the ones the student
  # creates by hand in module 02.
  #
  # Unlike /refresh it has no type guard. ansible_automation_platform
  # 422s on refresh ("Refresh Not Supported") but validates normally,
  # so this runs for all three types.
  #
  # Synchronous: the status has already moved by the time it returns.
  ansible.builtin.uri:
    url: "{{ _ao_api }}/integrations/{{ _int_id }}/validate"
    method: POST
    headers: "{{ _ao_headers }}"
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_int_validate
  # Never fatal, at either layer. The result of this call is advisory
  # — see the warning below — so the call itself must not be the thing
  # that fails a provision. Without this, a transient 5xx, or an AAP
  # controller slow enough to pass uri's timeout while AO probes it,
  # would abort a run over a status field nothing downstream reads.
  failed_when: false

- name: "Warn on a failed validation: {{ _int_name }}"
  # A failed validation is HTTP *200* with success:false — a pointed
  # base_url at a live host that speaks no MCP returned
  # 200 {"success": false, "error": "Method not allowed: HTTP 405",
  # "error_type": "connection_error"}. So status_code proves nothing
  # here; only the body does.
  #
  # Warn rather than fail. MCP integrations in this lab have been seen
  # reporting a failed validation while the MCP protocol itself works,
  # so failing the provision here would break runs that are fine.
  # qa-automation/healthcheck.yml is where runnability is asserted.
  # Two distinct failures, one warning: AO said the integration is
  # broken (200 + success:false), or the validate call itself did not
  # land (anything else, now that failed_when is off).
  when: >-
    r_int_validate.status | default(0) != 200
    or not (r_int_validate.json.success | default(false) | bool)
  ansible.builtin.debug:
    msg: |
      WARNING: {{ _int_name }} did not pass AO's validation check.

        HTTP:       {{ r_int_validate.status | default('(no response)') }}
        error_type: {{ r_int_validate.json.error_type | default('(none)') }}
        error:      {{ r_int_validate.json.error
                       | default(r_int_validate.msg | default('(none)')) }}

      The integration still exists and is still wired into the
      workflows. If AO reported the error, it shows as 'error' in the
      AO UI and its tools or models may not be callable at run time; if
      the call itself failed, the status is simply still 'unknown' and
      nothing else is affected.

- name: "Refresh integration: {{ _int_name }}"
  # Mandatory for the two types that enumerate a resource: before a
  # refresh, /models and /tools do not return addressable IDs, so any
  # wiring built from them would be empty.
  #
  # ansible_automation_platform enumerates nothing, and AO rejects the
  # call outright — 422 INTEGRATION_REFRESH_NOT_SUPPORTED, retryable
  # false. Same type guard as the two polls below.
  when: _int_type in [_ao_integration_type_llm, _ao_integration_type_mcp]
  ansible.builtin.uri:
    url: "{{ _ao_api }}/integrations/{{ _int_id }}/refresh"
    method: POST
    headers: "{{ _ao_headers }}"
    status_code: [200, 201, 202, 204]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"

- name: "Wait for the integration to expose models: {{ _int_name }}"
  when: _int_type == _ao_integration_type_llm
  ansible.builtin.include_tasks: ao_poll_models.yml

- name: "Wait for the integration to expose tools: {{ _int_name }}"
  when: _int_type == _ao_integration_type_mcp
  ansible.builtin.include_tasks: ao_poll_tools.yml
