---
# Create the five solutions integrations.
#
# `scope` is exactly `global` | `project` (AO rejects anything else
# with "Input should be 'global' or 'project'"). `project_id` is NOT
# accepted on create and `project_ids` is read-only, so association is
# a separate POST /integrations/{id}/projects/{project_id}.
#
# Which scope each integration gets is a lab decision, not an API one:
#
#   project  Solutions LLM, Solutions AAP MCP — these carry the lab's
#            own LiteLLM virtual key and a minted AAP token, so they
#            stay inside `solutions` rather than being offered to every
#            project. Named for it too: the UI's integrations list is
#            flat, so the name is the only thing telling the student
#            these two are not theirs to use.
#   global   AAP, OpenFlake MCP, Lightspeed MCP — shared infrastructure
#            the student is expected to reach from `default` too, since
#            modules 02 and 03 rebuild against the same endpoints.
#
# Left unset, AO defaults to `project` — which is how all five were
# created before this was passed explicitly.
#
# Every `configuration` repeats `integration_type` — see vars/main.yml.
#
# AO refuses a base_url resolving to a private, reserved or
# cloud-metadata address (SSRF guard), so these are the public Routes,
# not in-cluster `.svc` names.

- name: Initialise the integration id map
  ansible.builtin.set_fact:
    _ao_integration_ids: {}
    _ao_integration_tools: {}
    # Which credential an agentic node must cite when it connects to a
    # given integration — AO requires a credential_id on every
    # integration_connections entry, not just an integration_id. It is
    # the same credential the integration itself manages with, but the
    # two are separate fields in the API, so the mapping is explicit.
    _ao_integration_credentials:
      llm: llm
      aap: aap
      aap_mcp: aap_mcp
      openflake_mcp: openflake_mcp
      lightspeed_mcp: lightspeed_mcp

- name: Create the LLM integration
  ansible.builtin.include_tasks: ao_create_integration.yml
  vars:
    _int_key: llm
    _int_name: "{{ ocp4_workload_automation_orchestrator_config_llm_integration_name }}"
    _int_type: "{{ _ao_integration_type_llm }}"
    _int_credential: llm
    _int_configuration:
      integration_type: "{{ _ao_integration_type_llm }}"
      base_url: "{{ ocp4_workload_automation_orchestrator_config_llm_base_url }}"
      provider_hint: "{{ _ao_llm_provider_hint }}"

- name: Create the AAP integration
  ansible.builtin.include_tasks: ao_create_integration.yml
  vars:
    _int_key: aap
    _int_scope: global
    _int_name: "{{ ocp4_workload_automation_orchestrator_config_aap_integration_name }}"
    _int_type: "{{ _ao_integration_type_aap }}"
    _int_credential: aap
    _int_configuration:
      integration_type: "{{ _ao_integration_type_aap }}"
      base_url: "{{ _aap_api }}"

- name: Create the AAP MCP integration
  ansible.builtin.include_tasks: ao_create_integration.yml
  vars:
    _int_key: aap_mcp
    _int_name: "{{ ocp4_workload_automation_orchestrator_config_aap_mcp_integration_name }}"
    _int_type: "{{ _ao_integration_type_mcp }}"
    _int_credential: aap_mcp
    _int_configuration:
      integration_type: "{{ _ao_integration_type_mcp }}"
      base_url: "https://{{ ocp4_workload_automation_orchestrator_config_aap_mcp_host }}/mcp"

- name: Create the OpenFlake MCP integration
  ansible.builtin.include_tasks: ao_create_integration.yml
  vars:
    _int_key: openflake_mcp
    _int_scope: global
    _int_name: "{{ ocp4_workload_automation_orchestrator_config_openflake_mcp_integration_name }}"
    _int_type: "{{ _ao_integration_type_mcp }}"
    _int_credential: openflake_mcp
    _int_configuration:
      integration_type: "{{ _ao_integration_type_mcp }}"
      base_url: "https://{{ ocp4_workload_automation_orchestrator_config_openflake_mcp_host }}/mcp"

- name: Create the Lightspeed MCP integration
  # An MCP initialize POST returns 200 with no bearer and 200 with a
  # bogus one, and /tools listed 46 tools unauthenticated — so the
  # handshake and discovery are open. Tool *calls* are not: they reach
  # console.redhat.com on the service account's behalf. The credential
  # carries that service account secret.
  ansible.builtin.include_tasks: ao_create_integration.yml
  vars:
    _int_key: lightspeed_mcp
    _int_scope: global
    _int_name: "{{ ocp4_workload_automation_orchestrator_config_lightspeed_mcp_integration_name }}"
    _int_type: "{{ _ao_integration_type_mcp }}"
    _int_credential: lightspeed_mcp
    _int_configuration:
      integration_type: "{{ _ao_integration_type_mcp }}"
      base_url: "https://{{ ocp4_workload_automation_orchestrator_config_lightspeed_mcp_host }}/mcp"
