---
# Create one credential and record its id under `_cred_key`.
#
# Inputs: _cred_key, _cred_name, _cred_type (type NAME), _cred_inputs
#   _cred_project_id — optional; defaults to the solutions project.
#   _cred_target     — optional; `solutions` (default) records into
#                      _ao_credential_ids, `student` into
#                      _ao_student_credential_ids.
#
# Two projects need their own copy of some of these. AO credentials
# are hard project-scoped — there is no global credential, and a
# workflow citing one from another project is a 422 at create, not a
# validation warning — so a workflow in `default` can only use
# credentials that live in `default`. The integrations may be global;
# that does not help, because every integration_connections entry
# carries its own credential_id.

- name: "Create or reconcile credential {{ _cred_name }}"
  ansible.builtin.include_tasks: ao_find_or_create.yml
  vars:
    _fc_kind: credentials
    _fc_name: "{{ _cred_name }}"
    # Both projects use the SAME names, so the lookup has to be
    # narrowed or the student pass matches the solutions credential,
    # skips its create, and hands back an id from the wrong project.
    _fc_project_id: "{{ _cred_project_id | default(_ao_project_id) }}"
    _fc_body:
      name: "{{ _cred_name }}"
      credential_type_id: "{{ _ao_credential_type_ids[_cred_type] }}"
      project_id: "{{ _cred_project_id | default(_ao_project_id) }}"
      inputs: "{{ _cred_inputs }}"
    # Re-push secret material on re-runs: a rotated LiteLLM key or a
    # freshly minted AAP token must land on the existing credential
    # rather than leaving a stale value behind a matching name.
    _fc_patch:
      inputs: "{{ _cred_inputs }}"
    # `inputs` is the secret itself — the LiteLLM virtual key, the AAP
    # admin password, an MCP bearer token. `uri` echoes its request
    # body back in the task result, so without this a failed create or
    # a -vvv run prints them into the provision log.
    _fc_secret: true

- name: "Record the solutions credential id for {{ _cred_name }}"
  when: _cred_target | default('solutions') == 'solutions'
  ansible.builtin.set_fact:
    _ao_credential_ids: "{{ _ao_credential_ids | combine({_cred_key: _ao_object_id}) }}"

- name: "Record the student credential id for {{ _cred_name }}"
  when: _cred_target | default('solutions') == 'student'
  ansible.builtin.set_fact:
    _ao_student_credential_ids: >-
      {{ _ao_student_credential_ids | combine({_cred_key: _ao_object_id}) }}
