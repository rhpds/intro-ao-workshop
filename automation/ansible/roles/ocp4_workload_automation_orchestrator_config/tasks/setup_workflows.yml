---
# Import, wire, validate and publish every enabled workflow.
#
# Job template resolution is a single preflight across ALL workflows
# before any of them is imported, so a missing template is reported
# once, by name, rather than part-way through the second import with
# the first already half-configured.

- name: Select the enabled workflows
  ansible.builtin.set_fact:
    _ao_enabled_workflows: >-
      {{ ocp4_workload_automation_orchestrator_config_workflows
         | selectattr('enabled', 'defined')
         | selectattr('enabled')
         | rejectattr('requires_service_account', 'defined')
         | list
         + (ocp4_workload_automation_orchestrator_config_workflows
            | selectattr('enabled', 'defined')
            | selectattr('enabled')
            | selectattr('requires_service_account', 'defined')
            | list
            if ocp4_workload_automation_orchestrator_config_manage_service_account | bool
            else []) }}
    _ao_required_job_templates: []

- name: Warn about workflows skipped for want of a service account
  # A webhook-triggered workflow cannot be imported at all without an
  # authorized service account — AO rejects the definition — so the
  # choice is skip it or fail the provision. Skipping keeps
  # ..._manage_service_account: false a usable setting, which is what
  # it is documented to be.
  vars:
    _ao_skipped_workflows: >-
      {{ ocp4_workload_automation_orchestrator_config_workflows
         | selectattr('enabled', 'defined') | selectattr('enabled')
         | selectattr('requires_service_account', 'defined') | map(attribute='name') | list }}
  when:
    - not ocp4_workload_automation_orchestrator_config_manage_service_account | bool
    - _ao_skipped_workflows | length > 0
  ansible.builtin.debug:
    msg: |
      WARNING: skipping {{ _ao_skipped_workflows | join(', ') }}.

      These are triggered by webhook, and AO requires a non-empty
      authorized_service_account_ids on a webhook trigger — so they
      cannot be imported at all while
      ..._manage_service_account is false.

- name: Collect the AAP job templates every workflow needs
  ansible.builtin.include_tasks: ao_collect_job_templates.yml
  loop: "{{ _ao_enabled_workflows }}"
  loop_control:
    loop_var: _wf
    label: "{{ _wf.name }}"

- name: Resolve AAP job template names to ids
  ansible.builtin.include_tasks: resolve_job_templates.yml

- name: Import and wire each workflow
  ansible.builtin.include_tasks: ao_import_workflow.yml
  loop: "{{ _ao_enabled_workflows }}"
  loop_control:
    loop_var: _wf
    label: "{{ _wf.name }}"
