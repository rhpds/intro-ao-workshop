---
# Give the `default` project its own copy of the credentials the
# student scenarios need.
#
# This is forced by the API, not chosen. Credentials are hard
# project-scoped: `POST /credentials` requires a project_id, there is
# no global scope for them, and a workflow citing one from another
# project fails at create with 422 "One or more credential references
# are invalid or belong to a different project" — confirmed live
# 2026-10-08 by posting the student Ticket copy into `default` while
# it still pointed at solutions' credentials. Disk makes it
# unavoidable: nine AAP job template nodes and nothing else, so with
# no AAP credential in `default` it does not import at all.
#
# The INTEGRATIONS are not duplicated. AAP, Lightspeed MCP and
# OpenFlake MCP are already `scope: global`, so the same integration
# id works from either project; only the credential on each
# connection has to be local.
#
# Deliberately absent: LLM and AAP MCP. Those are what the student
# builds by hand in module 02, so provisioning must not pre-create
# them — their absence here is what leaves the agentic nodes blank.

- name: Initialise the student credential id map
  ansible.builtin.set_fact:
    _ao_student_credential_ids: {}

- name: Look up the student project
  ansible.builtin.uri:
    url: "{{ _ao_api }}/projects?limit={{ _ao_collection_page_size }}"
    method: GET
    headers: "{{ _ao_headers }}"
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_student_project

- name: Record the student project id
  vars:
    _matches: >-
      {{ r_student_project.json | intro_ao_workshop.automation.ao_collection
         | selectattr('name', 'equalto',
                      ocp4_workload_automation_orchestrator_config_student_project)
         | list }}
  ansible.builtin.set_fact:
    _ao_student_project_id: "{{ (_matches | first).id if _matches | length > 0 else '' }}"

- name: Fail when the student project does not exist
  # `default` ships with AO and this role never creates it, so its
  # absence means something is wrong with the instance rather than
  # with this run.
  when: _ao_student_project_id | length == 0
  ansible.builtin.fail:
    msg: >-
      Automation Orchestrator has no project named
      '{{ ocp4_workload_automation_orchestrator_config_student_project }}'.
      It ships with one, so either it was renamed or deleted. The
      student scenarios have nowhere to go.

- name: Create the student Ansible Automation Platform credential
  ansible.builtin.include_tasks: ao_create_credential.yml
  vars:
    _cred_key: aap
    _cred_target: student
    _cred_project_id: "{{ _ao_student_project_id }}"
    _cred_name: "{{ ocp4_workload_automation_orchestrator_config_aap_credential_name }}"
    _cred_type: "{{ _ao_credential_type_aap }}"
    _cred_inputs:
      username: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_user }}"
      password: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_password }}"

- name: Create the student OpenFlake MCP bearer token credential
  ansible.builtin.include_tasks: ao_create_credential.yml
  vars:
    _cred_key: openflake_mcp
    _cred_target: student
    _cred_project_id: "{{ _ao_student_project_id }}"
    _cred_name: "{{ ocp4_workload_automation_orchestrator_config_openflake_mcp_credential_name }}"
    _cred_type: "{{ _ao_credential_type_http_bearer }}"
    _cred_inputs:
      token: "{{ ocp4_workload_automation_orchestrator_config_openflake_mcp_token }}"

- name: Create the student Lightspeed MCP bearer token credential
  # _ao_lightspeed_mcp_token is resolved in setup_credentials.yml,
  # which runs first — either from the catalog variable or out of the
  # Secret the MCP server was deployed with.
  ansible.builtin.include_tasks: ao_create_credential.yml
  vars:
    _cred_key: lightspeed_mcp
    _cred_target: student
    _cred_project_id: "{{ _ao_student_project_id }}"
    _cred_name: "{{ ocp4_workload_automation_orchestrator_config_lightspeed_mcp_credential_name }}"
    _cred_type: "{{ _ao_credential_type_http_bearer }}"
    _cred_inputs:
      token: "{{ _ao_lightspeed_mcp_token }}"

- name: Show the student credentials
  when: not silent | bool
  ansible.builtin.debug:
    msg: >-
      Project '{{ ocp4_workload_automation_orchestrator_config_student_project }}'
      ({{ _ao_student_project_id }}) has credentials:
      {{ _ao_student_credential_ids.keys() | list | join(', ') }}.
      LLM and AAP MCP are absent on purpose — the student creates
      those.
