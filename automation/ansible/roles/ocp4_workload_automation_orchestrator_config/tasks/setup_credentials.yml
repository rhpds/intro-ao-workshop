---
# Create the credentials the solutions workflows need.
#
# AO credentials are hard project-scoped, enforced at workflow-create
# time with a 422 ("...belong to a different project"), and there is
# no global credential — so all of these live in `solutions`.
#
# One credential per MCP server. Lightspeed's is the console.redhat.com
# service account secret the MCP server itself was deployed with, read
# back out of the cluster rather than supplied twice.

- name: Fetch credential types
  ansible.builtin.uri:
    url: "{{ _ao_api }}/credential_types"
    method: GET
    headers: "{{ _ao_headers }}"
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_credential_types

- name: Build a credential type name to id map
  ansible.builtin.set_fact:
    # Per-instance UUIDs, so resolve by name every run.
    _ao_credential_type_ids: "{{ r_credential_types.json | intro_ao_workshop.automation.ao_name_id_map }}"

- name: Fail when an expected credential type is missing
  vars:
    _required_types:
      - "{{ _ao_credential_type_llm }}"
      - "{{ _ao_credential_type_aap }}"
      - "{{ _ao_credential_type_http_bearer }}"
  when: _required_types | difference(_ao_credential_type_ids.keys() | list) | length > 0
  ansible.builtin.fail:
    msg: >-
      Automation Orchestrator is missing credential type(s)
      {{ _required_types | difference(_ao_credential_type_ids.keys() | list) | join(', ') }}.
      Available: {{ _ao_credential_type_ids.keys() | list | join(', ') }}

- name: Normalise the available model list
  ansible.builtin.set_fact:
    # litellm_available_models arrives as a list on some catalogs and a
    # bare string on others: a plain lookup() collapses a single-item
    # result to a string, and this catalog's `Select Maas Model` is a
    # single-select, so it is always one model. Left as a string,
    # `| first` below would return its first CHARACTER.
    _ao_llm_available_models: >-
      {{ ocp4_workload_automation_orchestrator_config_llm_available_models
         if (ocp4_workload_automation_orchestrator_config_llm_available_models
             is sequence and
             ocp4_workload_automation_orchestrator_config_llm_available_models
             is not string)
         else (ocp4_workload_automation_orchestrator_config_llm_available_models
               | string | split(',') | map('trim') | select | list) }}

- name: Fail when no model was published by LiteLLM
  when: _ao_llm_available_models | length == 0
  ansible.builtin.fail:
    msg: >-
      litellm_available_models is empty. The LiteLLM virtual key
      workload did not publish a model, so there is nothing to wire the
      LLM credential to.

- name: Select the LLM model to use
  ansible.builtin.set_fact:
    # Pick from the models the catalog actually provisioned. The
    # upstream script's hardcoded preference chain (claude-sonnet,
    # claude, sonnet) falls through to "first available" on this lab's
    # models, making a misconfiguration look like a success.
    _ao_llm_model_name: >-
      {{ ocp4_workload_automation_orchestrator_config_llm_model
         if ocp4_workload_automation_orchestrator_config_llm_model | length > 0
         else (_ao_llm_available_models | first) }}

- name: Fail when the pinned LLM model is not available
  when:
    - ocp4_workload_automation_orchestrator_config_llm_model | length > 0
    - ocp4_workload_automation_orchestrator_config_llm_model
      not in _ao_llm_available_models
  ansible.builtin.fail:
    msg: >-
      Pinned model
      '{{ ocp4_workload_automation_orchestrator_config_llm_model }}' is not
      in litellm_available_models
      ({{ _ao_llm_available_models | join(', ') }}).

- name: Initialise the credential id map
  ansible.builtin.set_fact:
    _ao_credential_ids: {}

- name: Create the LLM Provider credential
  ansible.builtin.include_tasks: ao_create_credential.yml
  vars:
    _cred_key: llm
    _cred_name: "{{ ocp4_workload_automation_orchestrator_config_llm_credential_name }}"
    _cred_type: "{{ _ao_credential_type_llm }}"
    # api_key is the ONLY input this type accepts; the endpoint lives
    # on the integration.
    _cred_inputs:
      api_key: "{{ ocp4_workload_automation_orchestrator_config_llm_api_key }}"

- name: Create the Ansible Automation Platform credential
  ansible.builtin.include_tasks: ao_create_credential.yml
  vars:
    _cred_key: aap
    _cred_name: "{{ ocp4_workload_automation_orchestrator_config_aap_credential_name }}"
    _cred_type: "{{ _ao_credential_type_aap }}"
    # username+password or oauth_token, never both, and never
    # host/verify_ssl — those belong to the integration.
    _cred_inputs:
      username: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_user }}"
      password: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_password }}"

- name: Create the AAP MCP bearer token credential
  ansible.builtin.include_tasks: ao_create_credential.yml
  vars:
    _cred_key: aap_mcp
    _cred_name: "{{ ocp4_workload_automation_orchestrator_config_aap_mcp_credential_name }}"
    _cred_type: "{{ _ao_credential_type_http_bearer }}"
    _cred_inputs:
      token: "{{ _ao_aap_bearer_token }}"

- name: Create the OpenFlake MCP bearer token credential
  ansible.builtin.include_tasks: ao_create_credential.yml
  vars:
    _cred_key: openflake_mcp
    _cred_name: "{{ ocp4_workload_automation_orchestrator_config_openflake_mcp_credential_name }}"
    _cred_type: "{{ _ao_credential_type_http_bearer }}"
    _cred_inputs:
      token: "{{ ocp4_workload_automation_orchestrator_config_openflake_mcp_token }}"

- name: Read the Lightspeed MCP client secret from the cluster
  # Created by the sibling ocp4_workload_lightspeed_mcp_server role as
  # the MCP server's own console.redhat.com service account secret.
  # Reading it back keeps the two in step instead of making the catalog
  # supply the same value to two workloads.
  when: ocp4_workload_automation_orchestrator_config_lightspeed_mcp_token | length == 0
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ ocp4_workload_automation_orchestrator_config_lightspeed_mcp_secret_name }}"
    namespace: "{{ ocp4_workload_automation_orchestrator_config_lightspeed_mcp_secret_namespace }}"
  register: r_lightspeed_secret
  no_log: true

- name: Fail when the Lightspeed MCP credentials Secret is missing
  when:
    - ocp4_workload_automation_orchestrator_config_lightspeed_mcp_token | length == 0
    - r_lightspeed_secret.resources | default([]) | length == 0
  ansible.builtin.fail:
    msg: >-
      Secret
      {{ ocp4_workload_automation_orchestrator_config_lightspeed_mcp_secret_namespace }}/{{
         ocp4_workload_automation_orchestrator_config_lightspeed_mcp_secret_name }}
      does not exist. This role runs after
      ocp4_workload_lightspeed_mcp_server, which creates it — either that
      workload did not run, or set
      ocp4_workload_automation_orchestrator_config_lightspeed_mcp_token
      directly.

- name: Resolve the Lightspeed MCP token
  ansible.builtin.set_fact:
    _ao_lightspeed_mcp_token: >-
      {{ ocp4_workload_automation_orchestrator_config_lightspeed_mcp_token
         if ocp4_workload_automation_orchestrator_config_lightspeed_mcp_token | length > 0
         else (r_lightspeed_secret.resources[0].data[
                 ocp4_workload_automation_orchestrator_config_lightspeed_mcp_secret_key]
               | b64decode) }}
  no_log: true

- name: Fail when the Lightspeed MCP client secret is empty
  # The sibling role defaults its client_id/client_secret to "" and
  # creates the Secret regardless, so an unset catalog variable gives a
  # Secret that exists and holds nothing.
  when: _ao_lightspeed_mcp_token | length == 0
  ansible.builtin.fail:
    msg: >-
      {{ ocp4_workload_automation_orchestrator_config_lightspeed_mcp_secret_key }}
      in
      {{ ocp4_workload_automation_orchestrator_config_lightspeed_mcp_secret_namespace }}/{{
         ocp4_workload_automation_orchestrator_config_lightspeed_mcp_secret_name }}
      is empty. ocp4_workload_lightspeed_mcp_server_client_secret was
      never supplied to the catalog.

- name: Create the Lightspeed MCP bearer token credential
  ansible.builtin.include_tasks: ao_create_credential.yml
  vars:
    _cred_key: lightspeed_mcp
    _cred_name: "{{ ocp4_workload_automation_orchestrator_config_lightspeed_mcp_credential_name }}"
    _cred_type: "{{ _ao_credential_type_http_bearer }}"
    _cred_inputs:
      token: "{{ _ao_lightspeed_mcp_token }}"
