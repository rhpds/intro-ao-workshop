---
# Fetch one further page of /tools and merge it into `_int_tools_map`.
#
# No retry loop here: the first page already proved the integration has
# refreshed and is answering, so a failure on page two is a real error,
# not something to wait out.

- name: "Fetch a further tools page for {{ _int_name }}"
  ansible.builtin.uri:
    url: >-
      {{ _ao_api }}/integrations/{{ _int_id }}/tools?limit={{ _ao_tools_page_size }}&offset={{ _tools_offset }}
    method: GET
    headers: "{{ _ao_headers }}"
    status_code: [200]
    return_content: true
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_int_tools_page

- name: "Merge a further tools page for {{ _int_name }}"
  ansible.builtin.set_fact:
    _int_tools_map: >-
      {{ _int_tools_map
         | combine(r_int_tools_page.content
                   | regex_replace('[\x00-\x1f]', ' ')
                   | from_json
                   | intro_ao_workshop.automation.ao_name_id_map) }}
