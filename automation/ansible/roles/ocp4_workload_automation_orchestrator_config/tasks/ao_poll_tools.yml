---
# Poll an MCP integration until /tools is populated, page through the
# whole listing, then record a tool name -> tool id map under
# `_int_key`.
#
# Three quirks drive the shape of this file:
#
# 1. Tool descriptions contain raw control characters, which are
#    illegal inside JSON strings. A strict parser rejects the whole
#    document, so the response is read as text, scrubbed, and parsed
#    here rather than relying on the uri module's own parse.
#
# 2. `limit` is capped at 100 — 101 or more is a hard 422, not a
#    clamp — and AAP MCP exposes more tools than that. A single page
#    silently truncates: a measured run returned exactly 100 tools with
#    `job_templates_list` missing while `job_templates_retrieve` was
#    present, and Ticket Enrichment Demo pins `job_templates_list`.
#    Pagination is keyset, not offset: `total` is always null and the
#    `next` cursor is what advances it, so the page count is not known
#    up front and the loop below just runs a budget.
#
# 3. 422 is accepted so that a rejected request leaves the retry loop
#    on the first attempt. Polling exists to wait out an asynchronous
#    refresh, and AO marks validation errors `retryable: false` —
#    without this, a malformed request burns all 60 attempts before
#    failing.

- name: "Poll for tools: {{ _int_name }}"
  ansible.builtin.uri:
    url: "{{ _ao_api }}/integrations/{{ _int_id }}/tools?limit={{ _ao_tools_page_size }}"
    method: GET
    headers: "{{ _ao_headers }}"
    status_code: [200, 422]
    return_content: true
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_int_tools
  retries: "{{ ocp4_workload_automation_orchestrator_config_refresh_retries }}"
  delay: "{{ ocp4_workload_automation_orchestrator_config_refresh_delay }}"
  until:
    - r_int_tools is succeeded
    - r_int_tools.status != 200 or
      (r_int_tools.content | regex_replace('[\x00-\x1f]', ' ')
       | from_json | intro_ao_workshop.automation.ao_collection | length > 0)

- name: "Fail on a tools request AO rejected: {{ _int_name }}"
  when: r_int_tools.status != 200
  ansible.builtin.fail:
    msg: >-
      AO rejected the tool listing for {{ _int_name }} with HTTP
      {{ r_int_tools.status }}:
      {{ (r_int_tools.content | from_json).detail | default(r_int_tools.content) }}

- name: "Parse the first tool page for {{ _int_name }}"
  ansible.builtin.set_fact:
    _int_tools_payload: >-
      {{ r_int_tools.content | regex_replace('[\x00-\x1f]', ' ') | from_json }}

- name: "Start the tool map for {{ _int_name }}"
  ansible.builtin.set_fact:
    _int_tools_map: "{{ _int_tools_payload | intro_ao_workshop.automation.ao_name_id_map }}"
    # `| default('', true)` as well, because the key is present and
    # explicitly null on the last page rather than absent.
    _int_tools_cursor: "{{ _int_tools_payload.next | default('') | default('', true) }}"
    _int_tools_stalled: false

- name: "Show the pagination envelope for {{ _int_name }}"
  # Everything except `resources`. Printed because the paging below
  # depends on the envelope's shape, and the last time it changed the
  # list silently truncated instead of failing.
  when: not silent | bool
  ansible.builtin.debug:
    msg: >-
      {{ _int_name }} /tools envelope:
      {{ _int_tools_payload | dict2items
         | rejectattr('key', 'equalto', 'resources')
         | items2dict }}

- name: "Fetch the remaining tool pages for {{ _int_name }}"
  # Keyset pagination gives no page count up front — `total` is always
  # null — so this runs the page budget and each include is a no-op
  # once the cursor is spent.
  ansible.builtin.include_tasks: ao_fetch_tools_page.yml
  loop: "{{ range(1, _ao_tools_max_pages | int) | list }}"
  loop_control:
    loop_var: _tools_page
    label: "{{ _int_name }} page {{ _tools_page + 1 }}"

- name: "Record the tool map for {{ _int_name }}"
  ansible.builtin.set_fact:
    _ao_integration_tools: "{{ _ao_integration_tools | combine({_int_key: _int_tools_map}) }}"

- name: "Warn on a tool list that did not page to completion: {{ _int_name }}"
  # A short list wires cleanly and leaves the agent unable to call a
  # tool its prompt names, so it has to be loud.
  when: _int_tools_stalled | bool or _int_tools_cursor | length > 0
  ansible.builtin.debug:
    msg: |
      WARNING: {{ _int_name }}'s tool list is truncated at
      {{ _int_tools_map | length }} tools.

      Cursor repeated: {{ _int_tools_stalled }} — if true, AO returned
      the same page twice. '{{ _ao_tools_cursor_param }}' was the
      verified parameter when this was written, so this means AO's
      pagination changed; re-probe it and correct
      _ao_tools_cursor_param in vars/main.yml.

      Cursor still pending: {{ _int_tools_cursor | length > 0 }} — if
      true, the budget of {{ _ao_tools_max_pages }} pages ran out. Raise
      _ao_tools_max_pages in vars/main.yml.

- name: "Show the tools exposed by {{ _int_name }}"
  when: not silent | bool
  ansible.builtin.debug:
    msg: >-
      {{ _int_name }} exposes {{ _int_tools_map | length }} tool(s):
      {{ _int_tools_map.keys() | list | sort | join(', ') }}
