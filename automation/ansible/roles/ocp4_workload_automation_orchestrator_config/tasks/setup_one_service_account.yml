---
# Mint one AO service account for AAP's callbacks into
# POST /api/v1/webhooks/{path}, and push the pair onto AgnosticV's
# REPLACE_ME credential. Called once per entry in
# ..._service_accounts, with that entry as `_sa`.
#
# Two API facts shape this file:
#
# 1. `client_secret` is returned ONCE, by the call that mints it; a
#    later GET omits it. An existing account's secret is unreadable.
# 2. `rotate` is therefore the re-run path: same record, same
#    `identifier`, fresh secret, old one valid for
#    grace_period_seconds. Minting a new credential each run would
#    accumulate live credentials forever.
#
# `identifier` is the client_id — `nx_sa_<16 hex>`.

- name: "List projects to place the service account: {{ _sa.name }}"
  ansible.builtin.uri:
    url: "{{ _ao_api }}/projects?limit={{ _ao_collection_page_size }}"
    method: GET
    headers: "{{ _ao_headers }}"
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_projects

- name: "Resolve the project for {{ _sa.name }}"
  # Not _ao_project_id: `default` is a project this role never creates,
  # and the student account has to live in it.
  ansible.builtin.set_fact:
    _ao_sa_project_id: >-
      {{ (r_sa_projects.json | intro_ao_workshop.automation.ao_collection
          | selectattr('name', 'equalto', _sa.project)
          | map(attribute='id') | list | first) | default('', true) }}

- name: "Fail when the project for {{ _sa.name }} does not exist"
  when: _ao_sa_project_id | length == 0
  ansible.builtin.fail:
    msg: >-
      No Automation Orchestrator project named '{{ _sa.project }}' to
      own the service account '{{ _sa.name }}'. Available:
      {{ r_sa_projects.json | intro_ao_workshop.automation.ao_collection | map(attribute='name') | join(', ') }}.

- name: "Look up the service account: {{ _sa.name }}"
  ansible.builtin.uri:
    url: "{{ _ao_api }}/service_accounts?limit={{ _ao_collection_page_size }}"
    method: GET
    headers: "{{ _ao_headers }}"
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_list

- name: "Select the service account: {{ _sa.name }}"
  ansible.builtin.set_fact:
    _ao_sa_existing: >-
      {{ r_sa_list.json | intro_ao_workshop.automation.ao_collection
         | selectattr('name', 'equalto', _sa.name)
         | list }}

- name: "Create the service account: {{ _sa.name }}"
  when: _ao_sa_existing | length == 0
  ansible.builtin.uri:
    url: "{{ _ao_api }}/service_accounts"
    method: POST
    headers: "{{ _ao_headers }}"
    body_format: json
    body:
      name: "{{ _sa.name }}"
      description: "{{ _sa.description }}"
      project_id: "{{ _ao_sa_project_id }}"
    status_code: [200, 201]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_create

- name: "Record the id for {{ _sa.name }}"
  ansible.builtin.set_fact:
    _ao_sa_id: >-
      {{ _ao_sa_existing[0].id if _ao_sa_existing | length > 0
         else r_sa_create.json.id }}

- name: "List the credentials on {{ _sa.name }}"
  ansible.builtin.uri:
    url: "{{ _ao_api }}/service_accounts/{{ _ao_sa_id }}/credentials?limit={{ _ao_collection_page_size }}"
    method: GET
    headers: "{{ _ao_headers }}"
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_creds

- name: "Select an active client_credentials entry on {{ _sa.name }}"
  ansible.builtin.set_fact:
    _ao_sa_active_credentials: >-
      {{ r_sa_creds.json | intro_ao_workshop.automation.ao_collection
         | selectattr('credential_type', 'equalto', 'client_credentials')
         | selectattr('status', 'equalto', 'active')
         | list }}

- name: "Mint the first client_credentials secret for {{ _sa.name }}"
  when: _ao_sa_active_credentials | length == 0
  ansible.builtin.uri:
    url: "{{ _ao_api }}/service_accounts/{{ _ao_sa_id }}/credentials"
    method: POST
    headers: "{{ _ao_headers }}"
    body_format: json
    body:
      credential_type: client_credentials
    status_code: [200, 201]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_cred_create
  no_log: true

- name: "Rotate the existing client_credentials secret for {{ _sa.name }}"
  # The only way to get a usable secret for an existing account.
  when: _ao_sa_active_credentials | length > 0
  ansible.builtin.uri:
    url: >-
      {{ _ao_api }}/service_accounts/{{ _ao_sa_id }}/credentials/{{
         _ao_sa_active_credentials[0].id }}/rotate
    method: POST
    headers: "{{ _ao_headers }}"
    body_format: json
    body: {}
    status_code: [200, 201]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_cred_rotate
  no_log: true

- name: "Record the client id and secret for {{ _sa.name }}"
  # Both results are re-registered every iteration, including when the
  # task is skipped, so `is skipped` reads this account's outcome and
  # not the previous one's.
  ansible.builtin.set_fact:
    _ao_sa_client_id: >-
      {{ (r_sa_cred_rotate.json if r_sa_cred_create is skipped
          else r_sa_cred_create.json).identifier }}
    _ao_sa_client_secret: >-
      {{ (r_sa_cred_rotate.json if r_sa_cred_create is skipped
          else r_sa_cred_create.json).client_secret }}
  no_log: true

- name: "Fail when AO returned no client secret for {{ _sa.name }}"
  when: _ao_sa_client_secret | length == 0
  ansible.builtin.fail:
    msg: >-
      AO issued a service account credential but returned no
      client_secret. The secret is only ever returned by the call that
      mints it, so it cannot be recovered — delete the service account
      '{{ _sa.name }}' and re-run.

- name: "Add {{ _sa.name }} to the service account map"
  # Keyed by `_sa.key`, which is what vars/bindings_*.yml cites to
  # authorize a webhook trigger.
  ansible.builtin.set_fact:
    _ao_service_account_ids: >-
      {{ _ao_service_account_ids | default({}, true)
         | combine({_sa.key: _ao_sa_id}) }}

- name: "Patch the client id and secret onto {{ _sa.aap_credential }}"
  ansible.builtin.include_tasks: patch_aap_credential.yml
