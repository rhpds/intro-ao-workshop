---
# Replace the literal REPLACE_ME values on the AAP credential that
# AgnosticV's `controller_credentials` creates and annotates "set
# manually".
#
# Ordering works out without any extra care: this role already has to
# run after infra.aap_configuration.dispatch (it needs job templates
# to exist so `aap_job_template` nodes can resolve a job_template_id),
# and dispatch is what writes the placeholder credential. It is always
# there to patch by the time we get here.
#
# PATCHing `inputs` on an AAP credential replaces the whole object, so
# both fields go in one call.
#
# This is the one part of the role whose field names are not verified
# against a live system: `AO webhooks` is a custom credential type
# defined in AgnosticV, not something AO or AAP exposes, and no AAP
# instance was available while this was written. Both the type's input
# keys and the credential name are therefore variables — if the patch
# 400s on an unknown field, correct them in defaults/main.yml rather
# than here.

- name: Look up the Automation Orchestrator credential in AAP
  ansible.builtin.uri:
    url: >-
      {{ _aap_api }}/api/controller/v2/credentials/?name={{
         ocp4_workload_automation_orchestrator_config_aap_ao_credential_name | urlencode }}
    method: GET
    user: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_user }}"
    password: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_aap_validate_certs }}"
  register: r_aap_ao_credential
  retries: "{{ ocp4_workload_automation_orchestrator_config_api_retries }}"
  delay: "{{ ocp4_workload_automation_orchestrator_config_api_delay }}"
  until: r_aap_ao_credential is succeeded

- name: Warn when the AAP credential is absent
  when: r_aap_ao_credential.json.results | default([]) | length == 0
  ansible.builtin.debug:
    msg: >-
      WARNING: no AAP credential named
      '{{ ocp4_workload_automation_orchestrator_config_aap_ao_credential_name }}'.
      Nothing to patch, so AAP cannot authenticate to AO. Either
      AgnosticV's controller_credentials no longer creates it, or it
      was renamed — check
      ocp4_workload_automation_orchestrator_config_aap_ao_credential_name.

- name: Push the AO service account credentials onto the AAP credential
  when: r_aap_ao_credential.json.results | default([]) | length > 0
  ansible.builtin.uri:
    url: "{{ _aap_api }}/api/controller/v2/credentials/{{ r_aap_ao_credential.json.results[0].id }}/"
    method: PATCH
    user: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_user }}"
    password: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      inputs: >-
        {{ {
             ocp4_workload_automation_orchestrator_config_aap_ao_client_id_field:
               _ao_sa_client_id,
             ocp4_workload_automation_orchestrator_config_aap_ao_client_secret_field:
               _ao_sa_client_secret,
           } }}
    status_code: [200, 202]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_aap_validate_certs }}"
  register: r_aap_ao_patch
  no_log: true

- name: Report the service account wiring
  when: not silent | bool
  ansible.builtin.debug:
    msg: >-
      Service account
      '{{ ocp4_workload_automation_orchestrator_config_service_account_name }}'
      ({{ _ao_sa_client_id }}) is
      {{ 'patched onto' if r_aap_ao_patch is not skipped else 'NOT patched onto' }}
      the AAP credential
      '{{ ocp4_workload_automation_orchestrator_config_aap_ao_credential_name }}'.
