---
# Replace the REPLACE_ME values on the AAP credential AgnosticV
# creates and annotates "set manually". Called from
# setup_one_service_account.yml with that account as `_sa`, so it
# patches `_sa.aap_credential` with `_sa`'s freshly minted pair.
# Ordering is free: dispatch writes those credentials, and this role
# already runs after dispatch.
#
# PATCHing `inputs` REPLACES the object rather than merging, and the
# `AO webhooks (*)` types have a third field, base_url, that AgnosticV
# fills from ao_url user_data — so the pair is combined onto the
# existing inputs. Sending it alone would silently drop the URL.
#
# The GET masks secrets as "$encrypted$", which the controller reads
# back as "keep stored value", so round-tripping them is safe.

- name: "Look up the AAP credential: {{ _sa.aap_credential }}"
  ansible.builtin.uri:
    url: >-
      {{ _aap_api }}/api/controller/v2/credentials/?name={{
         _sa.aap_credential | urlencode }}
    method: GET
    user: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_user }}"
    password: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_aap_validate_certs }}"
  register: r_aap_ao_credential
  retries: "{{ ocp4_workload_automation_orchestrator_config_api_retries }}"
  delay: "{{ ocp4_workload_automation_orchestrator_config_api_delay }}"
  until: r_aap_ao_credential is succeeded

- name: Warn when the AAP credential is absent
  when: r_aap_ao_credential.json.results | default([]) | length == 0
  ansible.builtin.debug:
    msg: >-
      WARNING: no AAP credential named '{{ _sa.aap_credential }}'.
      Nothing to patch, so AAP cannot authenticate to AO as
      '{{ _sa.name }}'. Either AgnosticV's controller_credentials no
      longer creates it, or it was renamed — check the
      `aap_credential` on the matching entry of
      ocp4_workload_automation_orchestrator_config_service_accounts.

- name: Push the AO service account credentials onto the AAP credential
  when: r_aap_ao_credential.json.results | default([]) | length > 0
  ansible.builtin.uri:
    url: "{{ _aap_api }}/api/controller/v2/credentials/{{ r_aap_ao_credential.json.results[0].id }}/"
    method: PATCH
    user: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_user }}"
    password: "{{ ocp4_workload_automation_orchestrator_config_aap_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      inputs: >-
        {{ (r_aap_ao_credential.json.results[0].inputs | default({}, true))
           | combine({
               ocp4_workload_automation_orchestrator_config_aap_ao_client_id_field:
                 _ao_sa_client_id,
               ocp4_workload_automation_orchestrator_config_aap_ao_client_secret_field:
                 _ao_sa_client_secret,
             }) }}
    status_code: [200, 202]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_aap_validate_certs }}"
  register: r_aap_ao_patch
  no_log: true

- name: Report the service account wiring
  when: not silent | bool
  ansible.builtin.debug:
    msg: >-
      Service account '{{ _sa.name }}' ({{ _ao_sa_client_id }}) in
      project '{{ _sa.project }}' is
      {{ 'patched onto' if r_aap_ao_patch is not skipped else 'NOT patched onto' }}
      the AAP credential '{{ _sa.aap_credential }}'.
