---
# Mint an AO service account for AAP's callbacks into
# POST /api/v1/webhooks/{path}, and push the pair onto AgnosticV's
# REPLACE_ME credential.
#
# Two API facts shape this file:
#
# 1. `client_secret` is returned ONCE, by the call that mints it; a
#    later GET omits it. An existing account's secret is unreadable.
# 2. `rotate` is therefore the re-run path: same record, same
#    `identifier`, fresh secret, old one valid for
#    grace_period_seconds. Minting a new credential each run would
#    accumulate live credentials forever.
#
# `identifier` is the client_id — `nx_sa_<16 hex>`.

- name: List projects to place the service account
  ansible.builtin.uri:
    url: "{{ _ao_api }}/projects?limit={{ _ao_collection_page_size }}"
    method: GET
    headers: "{{ _ao_headers }}"
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_projects

- name: Resolve the service account project
  # Not _ao_project_id: configurable so the account can move to the
  # student's project if AAP ever triggers a workflow they built.
  ansible.builtin.set_fact:
    _ao_sa_project_id: >-
      {{ (r_sa_projects.json | intro_ao_workshop.automation.ao_collection
          | selectattr('name', 'equalto',
                       ocp4_workload_automation_orchestrator_config_service_account_project)
          | map(attribute='id') | list | first) | default('', true) }}

- name: Fail when the service account project does not exist
  when: _ao_sa_project_id | length == 0
  ansible.builtin.fail:
    msg: >-
      No Automation Orchestrator project named
      '{{ ocp4_workload_automation_orchestrator_config_service_account_project }}'
      to own the service account. Available:
      {{ r_sa_projects.json | intro_ao_workshop.automation.ao_collection | map(attribute='name') | join(', ') }}.

- name: Look up the service account
  ansible.builtin.uri:
    url: "{{ _ao_api }}/service_accounts?limit={{ _ao_collection_page_size }}"
    method: GET
    headers: "{{ _ao_headers }}"
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_list

- name: Select the service account
  ansible.builtin.set_fact:
    _ao_sa_existing: >-
      {{ r_sa_list.json | intro_ao_workshop.automation.ao_collection
         | selectattr('name', 'equalto',
                      ocp4_workload_automation_orchestrator_config_service_account_name)
         | list }}

- name: Create the service account
  when: _ao_sa_existing | length == 0
  ansible.builtin.uri:
    url: "{{ _ao_api }}/service_accounts"
    method: POST
    headers: "{{ _ao_headers }}"
    body_format: json
    body:
      name: "{{ ocp4_workload_automation_orchestrator_config_service_account_name }}"
      description: "{{ ocp4_workload_automation_orchestrator_config_service_account_description }}"
      project_id: "{{ _ao_sa_project_id }}"
    status_code: [200, 201]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_create

- name: Record the service account id
  ansible.builtin.set_fact:
    _ao_service_account_id: >-
      {{ _ao_sa_existing[0].id if _ao_sa_existing | length > 0
         else r_sa_create.json.id }}

- name: List the credentials on the service account
  ansible.builtin.uri:
    url: "{{ _ao_api }}/service_accounts/{{ _ao_service_account_id }}/credentials?limit={{ _ao_collection_page_size }}"
    method: GET
    headers: "{{ _ao_headers }}"
    status_code: [200]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_creds

- name: Select an active client_credentials entry
  ansible.builtin.set_fact:
    _ao_sa_active_credentials: >-
      {{ r_sa_creds.json | intro_ao_workshop.automation.ao_collection
         | selectattr('credential_type', 'equalto', 'client_credentials')
         | selectattr('status', 'equalto', 'active')
         | list }}

- name: Mint the first client_credentials secret
  when: _ao_sa_active_credentials | length == 0
  ansible.builtin.uri:
    url: "{{ _ao_api }}/service_accounts/{{ _ao_service_account_id }}/credentials"
    method: POST
    headers: "{{ _ao_headers }}"
    body_format: json
    body:
      credential_type: client_credentials
    status_code: [200, 201]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_cred_create
  no_log: true

- name: Rotate the existing client_credentials secret
  # The only way to get a usable secret for an existing account.
  when: _ao_sa_active_credentials | length > 0
  ansible.builtin.uri:
    url: >-
      {{ _ao_api }}/service_accounts/{{ _ao_service_account_id }}/credentials/{{
         _ao_sa_active_credentials[0].id }}/rotate
    method: POST
    headers: "{{ _ao_headers }}"
    body_format: json
    body: {}
    status_code: [200, 201]
    validate_certs: "{{ ocp4_workload_automation_orchestrator_config_validate_certs }}"
  register: r_sa_cred_rotate
  no_log: true

- name: Record the client id and secret
  ansible.builtin.set_fact:
    _ao_sa_client_id: >-
      {{ (r_sa_cred_rotate.json if r_sa_cred_create is skipped
          else r_sa_cred_create.json).identifier }}
    _ao_sa_client_secret: >-
      {{ (r_sa_cred_rotate.json if r_sa_cred_create is skipped
          else r_sa_cred_create.json).client_secret }}
  no_log: true

- name: Fail when AO returned no client secret
  when: _ao_sa_client_secret | length == 0
  ansible.builtin.fail:
    msg: >-
      AO issued a service account credential but returned no
      client_secret. The secret is only ever returned by the call that
      mints it, so it cannot be recovered — delete the service account
      '{{ ocp4_workload_automation_orchestrator_config_service_account_name }}'
      and re-run.

- name: Patch the client id and secret onto the AAP credential
  ansible.builtin.include_tasks: patch_aap_credential.yml
