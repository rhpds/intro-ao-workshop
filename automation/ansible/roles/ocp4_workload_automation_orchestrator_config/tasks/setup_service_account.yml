---
# Mint one AO service account per entry in ..._service_accounts.
#
# There are two because a webhook trigger can only be authorized by an
# account in its own workflow's project (passing one from elsewhere is
# a hard 422), and the lab fires webhooks into both projects: the
# reference workflows in `solutions` and the workflow the student
# builds in `default`.
#
# The per-account work is in setup_one_service_account.yml. This file
# only establishes the key -> id map that ao_import_workflow.yml hands
# to the wiring filter.

- name: Start an empty service account map
  # Seeded rather than left undefined so a re-run with a shortened
  # ..._service_accounts cannot leave a stale key behind.
  ansible.builtin.set_fact:
    _ao_service_account_ids: {}

- name: Mint each service account and patch its AAP credential
  ansible.builtin.include_tasks: setup_one_service_account.yml
  loop: "{{ ocp4_workload_automation_orchestrator_config_service_accounts }}"
  loop_control:
    loop_var: _sa
    label: "{{ _sa.name }} ({{ _sa.project }})"
