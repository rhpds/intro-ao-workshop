---
# Wiring for files/workflows/rhel-cve-remediation.json
#
# Only `agentic` and `aap_job_template` nodes appear here. The
# workflow's `script` (parse_investigation), `switch` (route_switch)
# and `approval` (approval_prod) nodes are self-contained and need no
# IDs patched into them.
#
# `credential` and `integration` values are keys into the asset maps
# this role builds at run time, not AO UUIDs.

ao_workflow_bindings:
  nodes:

    # --- AI nodes -------------------------------------------------

    # Triage: reads CVE advisory state from Lightspeed and the host's
    # `env` variable from AAP inventory, then picks a route. Its prompt
    # calls three tools by name, so they are pinned explicitly — if an
    # MCP server renames one, this should fail the provision rather
    # than hand the agent a tool it cannot call.
    triage_agent:
      type: agentic
      credential: llm
      integrations:
        - lightspeed_mcp
        - aap_mcp
      tool_selection_strategy: SELECTED
      tools:
        lightspeed_mcp:
          - vulnerability__get_cve_systems
        aap_mcp:
          - hosts_list
          - hosts_variable_data_retrieve

    # Investigation: the prompt asks for "all available info" from
    # Lightspeed and a package check via the AAP MCP without naming
    # tools, so the whole surface of both servers is offered rather
    # than a guessed subset.
    investigate_agent:
      type: agentic
      credential: llm
      integrations:
        - lightspeed_mcp
        - aap_mcp
      tool_selection_strategy: SELECTED
      tools_all:
        - lightspeed_mcp
        - aap_mcp

    # --- AAP job template nodes -----------------------------------

    fetch_and_commit:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Fetch and Commit

    deploy_script:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Sync and Deploy Remediation

    # Production branch — same two templates, reached through the
    # approval gate instead of directly.
    fetch_and_commit_prod:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Fetch and Commit

    deploy_script_prod:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Sync and Deploy Remediation

    notify_investigate:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Notify Mattermost Investigation

    # These two launch a job template whose *name* is produced upstream
    # by the deploy node (`${...artifacts.template_name}`). There is no
    # static template to resolve, so no job_template_id is set and AO
    # resolves the name at execution time.
    run_cve_remediation:
      type: aap_job_template
      credential: aap
      integration: aap

    run_cve_remediation_prod:
      type: aap_job_template
      credential: aap
      integration: aap
