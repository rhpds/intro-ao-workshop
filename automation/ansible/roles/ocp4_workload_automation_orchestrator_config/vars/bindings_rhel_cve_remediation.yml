---
# Wiring for files/workflows/rhel-cve-remediation.json
#
# Only agentic and aap_job_template nodes need wiring; the script,
# switch and approval nodes are self-contained. `credential` and
# `integration` are keys into the asset maps this role builds at run
# time, not AO UUIDs.

ao_workflow_bindings:

  # --- Trigger ------------------------------------------------------

  # The manual trigger needs no asset IDs, but its input schema is the
  # form the student fills in, and lab_tag is this environment's guid —
  # known at provision time and otherwise a trip to
  # /etc/insights-client/tags.yaml on a lab node to find. Listing it
  # here prefills the field's default from
  # resolved.trigger_defaults.lab_tag; it stays editable and stays
  # required. host and cve_id are deliberately not prefilled: picking
  # them is the exercise.
  triggers:
    trigger_manual:
      input_defaults:
        - lab_tag

  nodes:

    # --- AI nodes -------------------------------------------------

    # The five tools the prompt calls by name, in the order it calls
    # them. inventory__list_hosts is what scopes the run to this lab:
    # it is the only Lightspeed tool that takes a `tags` filter, and
    # the lab tag is an Insights tag, not a substring of any display
    # name. get_cve_systems then takes the UUID that returns, because
    # its own `filter_` searches display names only -- which here are
    # bare ("node1") and are reused by every other lab on the account.
    # Pinned rather than ALL: a renamed tool should fail the provision,
    # not the agent at run time.
    triage_agent:
      type: agentic
      credential: llm
      integrations:
        - lightspeed_mcp
        - aap_mcp
      tool_selection_strategy: SELECTED
      tools:
        lightspeed_mcp:
          - inventory__list_hosts
          - vulnerability__get_cve_systems
          - vulnerability__get_cve
        aap_mcp:
          - hosts_list
          - hosts_variable_data_retrieve

    # Triage reaches this node precisely when it could not resolve the
    # CVE, so there is nothing gathered to reason over. The prompt names
    # no tools, only the two servers: get_cve covers "all available info
    # about the CVE" from a bare CVE id, hosts_list covers the AAP host
    # lookup.
    investigate_agent:
      type: agentic
      credential: llm
      integrations:
        - lightspeed_mcp
        - aap_mcp
      tool_selection_strategy: SELECTED
      tools:
        lightspeed_mcp:
          - vulnerability__get_cve
        aap_mcp:
          - hosts_list

    # --- AAP job template nodes -----------------------------------

    fetch_and_commit:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Fetch and Commit

    deploy_script:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Sync and Deploy Remediation

    # Production branch — same two templates, reached through the
    # approval gate instead of directly.
    fetch_and_commit_prod:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Fetch and Commit

    deploy_script_prod:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Sync and Deploy Remediation

    notify_investigate:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Notify Mattermost Investigation

    # Success cards. Same template as the investigation card -- the
    # playbook picks which to post from the report_type extra_var, so
    # this needs no second job template. One node per branch rather than
    # one shared node: AO skips a node unless every inbound edge fires,
    # and the two branches are mutually exclusive, so a shared node
    # would never run.
    notify_remediated:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Notify Mattermost Investigation

    notify_remediated_prod:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Notify Mattermost Investigation

    # Launch whichever template the deploy node named upstream
    # (`${...artifacts.template_name}`), so no static job_template_id.
    run_cve_remediation:
      type: aap_job_template
      credential: aap
      integration: aap

    run_cve_remediation_prod:
      type: aap_job_template
      credential: aap
      integration: aap
