---
# Wiring for files/workflows/rhel-cve-remediation.json
#
# Only agentic and aap_job_template nodes need wiring; the script,
# switch and approval nodes are self-contained. `credential` and
# `integration` are keys into the asset maps this role builds at run
# time, not AO UUIDs.

ao_workflow_bindings:
  nodes:

    # --- AI nodes -------------------------------------------------

    # Triage does the gathering for this workflow, so it carries the
    # whole read-only surface it needs across both servers. Pinned
    # rather than ALL: a renamed tool should fail the provision, not
    # the agent at run time.
    triage_agent:
      type: agentic
      credential: llm
      integrations:
        - lightspeed_mcp
        - aap_mcp
      tool_selection_strategy: SELECTED
      tools:
        lightspeed_mcp:
          - vulnerability__get_cve_systems
          - vulnerability__get_cve
          - advisor__get_hosts_hitting_a_rule
          - advisor__get_recommendations_stats
          - advisor__get_rule_details
          - content-sources__list_repositories
          - inventory__get_host_details
          - inventory__get_host_system_profile
          - inventory__get_host_tags
          - inventory__list_hosts
        aap_mcp:
          - hosts_list
          - hosts_variable_data_retrieve
          - groups_list
          - inventories_list

    # Triage reaches this node precisely when it could not resolve the
    # CVE, so there is nothing gathered to reason over — the prompt
    # tells it to look the CVE up itself and check the host, which
    # needs its own tools.
    investigate_agent:
      type: agentic
      credential: llm
      integrations:
        - lightspeed_mcp
        - aap_mcp
      tool_selection_strategy: SELECTED
      tools:
        lightspeed_mcp:
          - vulnerability__get_cve
          - vulnerability__explain_cves
          - vulnerability__get_system_cves
          - inventory__get_host_details
          - inventory__get_host_system_profile
        aap_mcp:
          - hosts_list
          - hosts_variable_data_retrieve

    # --- AAP job template nodes -----------------------------------

    fetch_and_commit:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Fetch and Commit

    deploy_script:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Sync and Deploy Remediation

    # Production branch — same two templates, reached through the
    # approval gate instead of directly.
    fetch_and_commit_prod:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Fetch and Commit

    deploy_script_prod:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Sync and Deploy Remediation

    notify_investigate:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: CVE - Notify Mattermost Investigation

    # Launch whichever template the deploy node named upstream
    # (`${...artifacts.template_name}`), so no static job_template_id.
    run_cve_remediation:
      type: aap_job_template
      credential: aap
      integration: aap

    run_cve_remediation_prod:
      type: aap_job_template
      credential: aap
      integration: aap
