---
# Wiring for files/workflows/ticket-enrichment.json
#
# Only `agentic` and `aap_job_template` nodes appear here. The
# workflow's `switch` (route_switch) and `approval` (approval_gate)
# nodes are self-contained and need no IDs patched into them.
#
# `credential` and `integration` values are keys into the asset maps
# this role builds at run time, not AO UUIDs.
#
# This is the one workflow with a `webhook_trigger` rather than a
# manual trigger — POST /api/v1/webhooks/openflake-incident, which
# requires the `aap-webhooks` service account's bearer token. It is
# the only consumer of the service account this role mints.
#
# Its four "Update OpenFlake Ticket" nodes carry opaque
# `activity_<uuid>` IDs, so each is commented with where it sits in
# the graph.

ao_workflow_bindings:
  nodes:

    # --- AI nodes -------------------------------------------------

    # Triage: fetches the incident from OpenFlake, lists AAP job
    # templates, and picks a route (auto_remediate / needs_approval /
    # inform_only). Its prompt names both tools explicitly and insists
    # on exactly one call per step, so they are pinned rather than
    # offering the whole surface — a renamed tool should fail the
    # provision, not leave the agent guessing at run time.
    triage_agent:
      type: agentic
      credential: llm
      integrations:
        - openflake_mcp
        - aap_mcp
      tool_selection_strategy: SELECTED
      tools:
        openflake_mcp:
          - perform_query
        aap_mcp:
          - job_templates_list

    # Enrich and assign: the inform_only branch. Read-only — it fetches
    # the full incident record and returns text for a later node to
    # write back, so it needs OpenFlake only, and only one tool.
    enrich_and_assign_agent:
      type: agentic
      credential: llm
      integrations:
        - openflake_mcp
      tool_selection_strategy: SELECTED
      tools:
        openflake_mcp:
          - perform_query

    # --- AAP job template nodes -----------------------------------

    # All four ticket updates run the same template. The agents never
    # write to OpenFlake themselves; every write goes through here.

    # After triage, before the route switch — posts the triage summary.
    activity_87cdc884_e973_4338_b02e_1ac7b0a23329:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: Incidents | Update Ticket

    # After the auto-remediation branch (switch case_0).
    activity_31aceb85_eefd_4f85_8fdc_115d2480a5aa:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: Incidents | Update Ticket

    # After the approved-remediation branch (approval gate -> approved).
    activity_a73a42e2_e774_40ed_aeb1_6298ea13aedd:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: Incidents | Update Ticket

    # After the inform-only branch (switch case_2 -> enrich agent).
    activity_ae4f8c24_07ea_41a8_b70d_8dd74a4b393c:
      type: aap_job_template
      credential: aap
      integration: aap
      job_template: Incidents | Update Ticket

    # These two launch whichever template the triage agent named
    # (`${triage_agent.result.content.job_template_name}`). There is no
    # static template to resolve, so no job_template_id is set and AO
    # resolves the name at execution time.
    auto_remediation_job:
      type: aap_job_template
      credential: aap
      integration: aap

    remediation_job_approved:
      type: aap_job_template
      credential: aap
      integration: aap
