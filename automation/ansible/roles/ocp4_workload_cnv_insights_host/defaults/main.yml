---
become_override: false
silent: false

# Wait for the complete bastion-to-node Ansible path before changing registration.
# Bound individual SSH attempts as well as the overall readiness window.
ocp4_workload_cnv_insights_host_ssh_connect_timeout: 10
ocp4_workload_cnv_insights_host_ssh_retry_delay: 10
ocp4_workload_cnv_insights_host_ssh_wait_timeout: 300

# -------------------------------------------------------------------
# Nodes to register — defaults to all rhel9_nodes added by infra_add_nodes
# -------------------------------------------------------------------
ocp4_workload_cnv_insights_host_nodes: "{{ groups['rhel9_nodes'] | default([]) }}"

ocp4_workload_cnv_insights_host_node_groups:
  - groups:
      - rhel9_nodes
    nodes:
      - node1
      - node2
      - node3

# -------------------------------------------------------------------
# Red Hat account credentials for rhc connect — REQUIRED
# Supply via secrets include.
# -------------------------------------------------------------------
ocp4_workload_cnv_insights_host_rh_username: "{{ rh_username | mandatory }}"
ocp4_workload_cnv_insights_host_rh_password: "{{ rh_password | mandatory }}"

# Poll without changing local registration state. Each readiness stage allows
# roughly five minutes of retry delays plus bounded HTTP request time.
ocp4_workload_cnv_insights_host_registration_retries: 30
ocp4_workload_cnv_insights_host_registration_delay: 10
