---
become_override: false
silent: false

# -------------------------------------------------------------------
# Nodes to register — defaults to all rhel9_nodes added by infra_add_nodes
# -------------------------------------------------------------------
ocp4_workload_cnv_insights_host_nodes: "{{ groups['rhel9_nodes'] | default([]) }}"

ocp4_workload_cnv_insights_host_node_groups:
  - groups:
      - rhel9_nodes
    nodes:
      - node1
      - node2
      - node3

# -------------------------------------------------------------------
# Red Hat Insights / rhc credentials — REQUIRED
# Supply via secrets include. These map to the mandatory vars in
# rhpds.rhel_management.insights_host:
#   insights_host_org           → insights_org (mandatory)
#   insights_host_activation_key → insights_activation_key (mandatory)
# -------------------------------------------------------------------
insights_host_org: "{{ insights_org | mandatory }}"
insights_host_activation_key: "{{ insights_activation_key | mandatory }}"

# -------------------------------------------------------------------
# PostgreSQL setup (part of the rhel_management demo environment)
# Set to false to skip DB initialisation if not needed.
# -------------------------------------------------------------------
ocp4_workload_cnv_insights_host_setup_postgresql: true
