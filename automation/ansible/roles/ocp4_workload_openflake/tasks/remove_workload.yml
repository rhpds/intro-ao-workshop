---
- name: Run preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Uninstall the OpenFlake release
  kubernetes.core.helm:
    release_name: "{{ ocp4_workload_openflake_release_name }}"
    release_namespace: "{{ ocp4_workload_openflake_namespace }}"
    binary_path: "{{ ocp4_workload_openflake_helm_binary | default(omit, true) }}"
    host: "{{ ocp4_workload_openflake_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_openflake_api_key | default(omit, true) }}"
    validate_certs: "{{ ocp4_workload_openflake_validate_certs | bool }}"
    wait: "{{ ocp4_workload_openflake_wait | bool }}"
    wait_timeout: "{{ ocp4_workload_openflake_wait_timeout }}"
    release_state: absent

# `helm uninstall --wait` returns once the API objects are deleted, but pods
# can linger through their termination grace period. Confirm they are gone
# before touching the namespace, so a delete does not race the teardown.
- name: Wait for the release's workloads to disappear
  kubernetes.core.k8s_info:
    kind: "{{ item }}"
    namespace: "{{ ocp4_workload_openflake_namespace }}"
    label_selectors:
      - "app.kubernetes.io/instance={{ ocp4_workload_openflake_release_name }}"
      - "app.kubernetes.io/part-of=openflake"
  register: _ocp4_workload_openflake_leftovers
  retries: "{{ ocp4_workload_openflake_verify_retries }}"
  delay: "{{ ocp4_workload_openflake_verify_delay }}"
  until: (_ocp4_workload_openflake_leftovers.resources | default([]) | length) == 0
  loop:
    - Deployment
    - StatefulSet
    - Pod

# `helm uninstall` leaves both PVCs behind: the attachments claim carries
# helm.sh/resource-policy=keep, and the Postgres claim belongs to the
# StatefulSet's volumeClaimTemplate.
- name: Delete the persistent volume claims
  when:
    - ocp4_workload_openflake_remove_pvcs | bool
    # Skipped when the namespace is going away anyway: deleting the claims and
    # then the namespace means waiting out the same teardown twice.
    - not (ocp4_workload_openflake_remove_namespace | bool)
  block:
    - name: Find the claims belonging to this release
      kubernetes.core.k8s_info:
        kind: PersistentVolumeClaim
        namespace: "{{ ocp4_workload_openflake_namespace }}"
        label_selectors:
          - "app.kubernetes.io/instance={{ ocp4_workload_openflake_release_name }}"
          - "app.kubernetes.io/part-of=openflake"
      register: _ocp4_workload_openflake_pvcs

    - name: Delete each claim
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ ocp4_workload_openflake_namespace }}"
        name: "{{ item.metadata.name }}"
        wait: true
      loop: "{{ _ocp4_workload_openflake_pvcs.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"

- name: Remove the namespace
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_workload_openflake_namespace }}"
    wait: true
    wait_timeout: "{{ ocp4_workload_openflake_namespace_delete_timeout | int }}"
  when: ocp4_workload_openflake_remove_namespace | bool
