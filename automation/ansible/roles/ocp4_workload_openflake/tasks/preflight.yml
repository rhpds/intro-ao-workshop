---
- name: Check for the helm binary
  ansible.builtin.command:
    cmd: "{{ _ocp4_workload_openflake_helm_bin }} version --short"
  register: _ocp4_workload_openflake_helm_check
  changed_when: false
  failed_when: false

# kubernetes.core.helm shells out to the helm CLI, which the stock execution
# environments do not ship. Rather than require a custom EE, fetch the
# official release into a scratch directory and use it from there.
- name: Install helm on the fly
  when:
    - _ocp4_workload_openflake_helm_check.rc != 0
    - ocp4_workload_openflake_helm_install_if_missing | bool
  block:
    - name: Read the execution node architecture
      ansible.builtin.command:
        cmd: uname -m
      register: _ocp4_workload_openflake_uname
      changed_when: false

    - name: Map the architecture to a helm release
      ansible.builtin.set_fact:
        _ocp4_workload_openflake_helm_arch: >-
          {{ {'x86_64': 'amd64', 'amd64': 'amd64',
              'aarch64': 'arm64', 'arm64': 'arm64'}.get(_ocp4_workload_openflake_uname.stdout | trim, '') }}

    - name: Fail on an architecture helm does not publish
      ansible.builtin.fail:
        msg: >-
          No helm release for architecture
          '{{ _ocp4_workload_openflake_uname.stdout | trim }}'. Set
          ocp4_workload_openflake_helm_binary to a helm you provide yourself.
      when: not _ocp4_workload_openflake_helm_arch

    - name: Create the scratch directory for helm
      ansible.builtin.file:
        path: "{{ ocp4_workload_openflake_helm_install_dir }}"
        state: directory
        mode: "0755"

    # The filename has to match the one inside the .sha256sum file, because
    # get_url looks the checksum up by the destination's basename.
    - name: Download the helm release archive
      ansible.builtin.get_url:
        url: "{{ _ocp4_workload_openflake_helm_url }}"
        dest: "{{ ocp4_workload_openflake_helm_install_dir }}/{{ _ocp4_workload_openflake_helm_tarball }}"
        checksum: "sha256:{{ _ocp4_workload_openflake_helm_url }}.sha256sum"
        mode: "0644"

    # Extracted with Python rather than the unarchive module, which shells out
    # to tar -- another binary a minimal execution environment may not have.
    - name: Unpack the helm binary
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "-c"
          - |
            import sys, tarfile
            archive, member, dest = sys.argv[1:4]
            with tarfile.open(archive) as tar:
                info = tar.getmember(member)
                info.name = "helm"
                tar.extract(info, dest)
          - "{{ ocp4_workload_openflake_helm_install_dir }}/{{ _ocp4_workload_openflake_helm_tarball }}"
          - "linux-{{ _ocp4_workload_openflake_helm_arch }}/helm"
          - "{{ ocp4_workload_openflake_helm_install_dir }}"
        creates: "{{ ocp4_workload_openflake_helm_install_dir }}/helm"

    - name: Make the helm binary executable
      ansible.builtin.file:
        path: "{{ ocp4_workload_openflake_helm_install_dir }}/helm"
        mode: "0755"

    # set_fact outranks role vars and defaults, so this steers both the checks
    # below and the binary_path every helm task passes to the module.
    - name: Use the downloaded helm from here on
      ansible.builtin.set_fact:
        _ocp4_workload_openflake_helm_bin: "{{ ocp4_workload_openflake_helm_install_dir }}/helm"
        ocp4_workload_openflake_helm_binary: "{{ ocp4_workload_openflake_helm_install_dir }}/helm"

    - name: Re-check helm now that it is installed
      ansible.builtin.command:
        cmd: "{{ _ocp4_workload_openflake_helm_bin }} version --short"
      register: _ocp4_workload_openflake_helm_check
      changed_when: false
      failed_when: false

- name: Fail when helm is unavailable
  ansible.builtin.fail:
    msg: |
      Could not run '{{ _ocp4_workload_openflake_helm_bin }} version --short'
      (rc={{ _ocp4_workload_openflake_helm_check.rc }}).

      kubernetes.core.helm shells out to the helm CLI. Either:
        - leave ocp4_workload_openflake_helm_install_if_missing true (the
          default) and give the execution environment egress to get.helm.sh; or
        - set ocp4_workload_openflake_helm_binary to an absolute path to helm.

      Error: {{ _ocp4_workload_openflake_helm_check.stderr
                | default(_ocp4_workload_openflake_helm_check.msg | default('')) | trim }}
  when: _ocp4_workload_openflake_helm_check.rc != 0

- name: Report the helm version in use
  ansible.builtin.debug:
    msg: >-
      Using helm {{ _ocp4_workload_openflake_helm_check.stdout | trim }}
      at '{{ _ocp4_workload_openflake_helm_bin }}'

- name: Confirm the chart directory exists
  ansible.builtin.stat:
    path: "{{ ocp4_workload_openflake_chart_path }}/Chart.yaml"
  register: _ocp4_workload_openflake_chart_stat

- name: Fail when the chart is missing
  ansible.builtin.fail:
    msg: >-
      No chart found at '{{ ocp4_workload_openflake_chart_path }}'
      (expected Chart.yaml there).
  when: not _ocp4_workload_openflake_chart_stat.stat.exists

# Doubles as an authentication check: fails fast with a clear error if the
# credentials are missing or expired, rather than letting helm fail later
# with a less obvious message.
- name: Query the cluster
  kubernetes.core.k8s_cluster_info:
  register: _ocp4_workload_openflake_cluster_info

- name: Report the connected cluster
  ansible.builtin.debug:
    msg: >-
      Connected to Kubernetes
      {{ _ocp4_workload_openflake_cluster_info.version.server.kubernetes.gitVersion
         | default('unknown') }}

- name: Fail when the cluster has no Route API but a Route was requested
  ansible.builtin.fail:
    msg: >-
      ocp4_workload_openflake_route_enabled is true but the cluster does not
      serve route.openshift.io/v1, so this is not an OpenShift cluster.
  when:
    - ocp4_workload_openflake_route_enabled | bool
    - (_ocp4_workload_openflake_cluster_info.apis | default({}) | length) > 0
    - "'route.openshift.io/v1' not in _ocp4_workload_openflake_cluster_info.apis"
