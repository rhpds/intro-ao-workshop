---
# -------------------------------------------------------
# Namespace & RBAC
# -------------------------------------------------------
- name: Create Mattermost namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp4_workload_mattermost_namespace }}"

- name: Create Mattermost ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: mattermost
        namespace: "{{ ocp4_workload_mattermost_namespace }}"

# PostgreSQL uses quay.io/sclorg/postgresql-15-c9s which is OCP-native
# and runs fine with the default restricted SCC — no special SA needed.
- name: Create PostgreSQL ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: mattermost-postgres
        namespace: "{{ ocp4_workload_mattermost_namespace }}"

# Only the Mattermost app image still needs anyuid (upstream image hardcodes USER 2000).
# PostgreSQL uses the OCP-native SCLORG image and runs with restricted SCC.
- name: Grant anyuid SCC to Mattermost ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "mattermost-anyuid-{{ ocp4_workload_mattermost_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:anyuid
      subjects:
        - kind: ServiceAccount
          name: mattermost
          namespace: "{{ ocp4_workload_mattermost_namespace }}"

# -------------------------------------------------------
# Secrets
# -------------------------------------------------------
- name: Create PostgreSQL credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mattermost-postgres-credentials
        namespace: "{{ ocp4_workload_mattermost_namespace }}"
      type: Opaque
      stringData:
        # SCLORG postgresql-15-c9s uses POSTGRESQL_* env var names
        POSTGRESQL_DATABASE: "{{ ocp4_workload_mattermost_postgres_db }}"
        POSTGRESQL_USER: "{{ ocp4_workload_mattermost_postgres_user }}"
        POSTGRESQL_PASSWORD: "{{ ocp4_workload_mattermost_postgres_password }}"

# -------------------------------------------------------
# PersistentVolumeClaims
# -------------------------------------------------------
- name: Create PostgreSQL PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: mattermost-postgres-data
        namespace: "{{ ocp4_workload_mattermost_namespace }}"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "{{ ocp4_workload_mattermost_storage_class | default(omit, true) }}"
        resources:
          requests:
            storage: "{{ ocp4_workload_mattermost_postgres_storage_size }}"

- name: Create Mattermost application data PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: mattermost-app-data
        namespace: "{{ ocp4_workload_mattermost_namespace }}"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "{{ ocp4_workload_mattermost_storage_class | default(omit, true) }}"
        resources:
          requests:
            storage: "{{ ocp4_workload_mattermost_data_storage_size }}"

# -------------------------------------------------------
# PostgreSQL Deployment
# -------------------------------------------------------
- name: Deploy PostgreSQL
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mattermost-postgres
        namespace: "{{ ocp4_workload_mattermost_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: mattermost-postgres
        template:
          metadata:
            labels:
              app: mattermost-postgres
          spec:
            serviceAccountName: mattermost-postgres
            containers:
              - name: postgres
                image: "{{ ocp4_workload_mattermost_postgres_image }}"
                envFrom:
                  - secretRef:
                      name: mattermost-postgres-credentials
                ports:
                  - containerPort: 5432
                volumeMounts:
                  - name: postgres-data
                    mountPath: /var/lib/pgsql/data
                    subPath: pgdata
                readinessProbe:
                  exec:
                    command: ["pg_isready", "-U", "{{ ocp4_workload_mattermost_postgres_user }}"]
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 12
            volumes:
              - name: postgres-data
                persistentVolumeClaim:
                  claimName: mattermost-postgres-data

- name: Create PostgreSQL Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: mattermost-postgres
        namespace: "{{ ocp4_workload_mattermost_namespace }}"
      spec:
        selector:
          app: mattermost-postgres
        ports:
          - port: 5432
            targetPort: 5432

- name: Wait for PostgreSQL Deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: mattermost-postgres
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
  register: _postgres_deployment
  retries: "{{ ocp4_workload_mattermost_wait_retries }}"
  delay: "{{ ocp4_workload_mattermost_wait_delay }}"
  until: >-
    _postgres_deployment.resources | length > 0 and
    (_postgres_deployment.resources[0].status.readyReplicas | default(0)) >= 1

# -------------------------------------------------------
# Route (create early to resolve site URL before deploying app)
# -------------------------------------------------------
- name: Create Mattermost Route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: mattermost
        namespace: "{{ ocp4_workload_mattermost_namespace }}"
      spec:
        to:
          kind: Service
          name: mattermost
        port:
          targetPort: 8065
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect

- name: Get Mattermost Route hostname
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: mattermost
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
  register: _mattermost_route
  retries: 10
  delay: 5
  until: >-
    _mattermost_route.resources | length > 0 and
    _mattermost_route.resources[0].spec.host is defined

- name: Set Mattermost site URL
  ansible.builtin.set_fact:
    _mattermost_site_url: >-
      {{ ocp4_workload_mattermost_site_url
         if ocp4_workload_mattermost_site_url
         else 'https://' ~ _mattermost_route.resources[0].spec.host }}

# -------------------------------------------------------
# Mattermost Deployment
# -------------------------------------------------------
- name: Create Mattermost application Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mattermost-config
        namespace: "{{ ocp4_workload_mattermost_namespace }}"
      type: Opaque
      stringData:
        MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
        MM_USERNAME: "{{ ocp4_workload_mattermost_postgres_user }}"
        MM_PASSWORD: "{{ ocp4_workload_mattermost_postgres_password }}"
        MM_DBNAME: "{{ ocp4_workload_mattermost_postgres_db }}"
        MM_SQLSETTINGS_DATASOURCE: >-
          postgres://{{ ocp4_workload_mattermost_postgres_user }}:{{
          ocp4_workload_mattermost_postgres_password | urlencode
          }}@mattermost-postgres:5432/{{
          ocp4_workload_mattermost_postgres_db
          }}?sslmode=disable&connect_timeout=10
        MM_SERVICESETTINGS_SITEURL: "{{ _mattermost_site_url }}"
        # Skip setup wizard and disable email verification for lab use
        MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"
        MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
        MM_EMAILSETTINGS_SMTPSERVER: ""
        # Lower minimum password length so lab passwords like 'redhat123' work
        MM_PASSWORDSETTINGS_MINIMUMLENGTH: "5"

- name: Deploy Mattermost
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mattermost
        namespace: "{{ ocp4_workload_mattermost_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: mattermost
        template:
          metadata:
            labels:
              app: mattermost
          spec:
            serviceAccountName: mattermost
            securityContext:
              runAsUser: 2000
              fsGroup: 2000
            containers:
              - name: mattermost
                image: "{{ ocp4_workload_mattermost_image }}"
                envFrom:
                  - secretRef:
                      name: mattermost-config
                ports:
                  - containerPort: 8065
                # All mattermost directories consolidated on a single PVC via subPath
                volumeMounts:
                  - name: app-data
                    mountPath: /mattermost/config
                    subPath: config
                  - name: app-data
                    mountPath: /mattermost/data
                    subPath: data
                  - name: app-data
                    mountPath: /mattermost/logs
                    subPath: logs
                  - name: app-data
                    mountPath: /mattermost/plugins
                    subPath: plugins
                  - name: app-data
                    mountPath: /mattermost/client/plugins
                    subPath: client-plugins
                  - name: app-data
                    mountPath: /mattermost/bleve-indexes
                    subPath: bleve-indexes
                readinessProbe:
                  httpGet:
                    path: /api/v4/system/ping
                    port: 8065
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 15
            volumes:
              - name: app-data
                persistentVolumeClaim:
                  claimName: mattermost-app-data

- name: Create Mattermost Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: mattermost
        namespace: "{{ ocp4_workload_mattermost_namespace }}"
      spec:
        selector:
          app: mattermost
        ports:
          - port: 8065
            targetPort: 8065

- name: Wait for Mattermost Deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: mattermost
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
  register: _mattermost_deployment
  retries: "{{ ocp4_workload_mattermost_wait_retries }}"
  delay: "{{ ocp4_workload_mattermost_wait_delay }}"
  until: >-
    _mattermost_deployment.resources | length > 0 and
    (_mattermost_deployment.resources[0].status.readyReplicas | default(0)) >= 1

# -------------------------------------------------------
# Post-deployment configuration (replaces podman exec)
# -------------------------------------------------------
- name: Get Mattermost pod name
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    label_selectors:
      - app=mattermost
  register: _mattermost_pods
  retries: 10
  delay: 5
  until: >-
    _mattermost_pods.resources | length > 0 and
    _mattermost_pods.resources[0].status.phase == 'Running'

- name: Set Mattermost pod name fact
  ansible.builtin.set_fact:
    _mattermost_pod_name: "{{ _mattermost_pods.resources[0].metadata.name }}"

- name: Wait for mmctl local mode to be available
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: mmctl --local system version
  register: _mmctl_ready
  retries: 10
  delay: 5
  until: _mmctl_ready.return_code == 0
  changed_when: false

- name: Create Mattermost admin user
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: >-
      mmctl --local user create
      --email admin@ansible.com
      --username admin
      --password {{ ocp4_workload_mattermost_admin_password }}
      --system-admin
  register: _admin_create
  failed_when: >-
    _admin_create.return_code != 0 and
    'already exists' not in (_admin_create.stderr | default(''))

# Store backup in a ConfigMap so the Mattermost pod can read it via a volume mount.
# This avoids kubectl cp (unreliable with Alpine/distroless exec) and the
# upload session API (stores files in the wrong location for --bypass-upload).
- name: Read backup file as base64
  ansible.builtin.slurp:
    src: "{{ role_path }}/files/{{ ocp4_workload_mattermost_backup_file }}"
  register: _backup_b64

- name: Create backup ConfigMap with binaryData
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mattermost-backup
        namespace: "{{ ocp4_workload_mattermost_namespace }}"
      binaryData:
        backup.zip: "{{ _backup_b64.content }}"

- name: Patch Mattermost Deployment to mount backup ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mattermost
        namespace: "{{ ocp4_workload_mattermost_namespace }}"
      spec:
        template:
          spec:
            containers:
              - name: mattermost
                volumeMounts:
                  - name: backup
                    mountPath: /mattermost/backup
                    readOnly: true
            volumes:
              - name: backup
                configMap:
                  name: mattermost-backup
    merge_type: strategic-merge

- name: Wait for Mattermost pod to restart with backup volume
  kubernetes.core.k8s_info:
    kind: Deployment
    name: mattermost
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
  register: _mm_dep_patched
  retries: "{{ ocp4_workload_mattermost_wait_retries }}"
  delay: "{{ ocp4_workload_mattermost_wait_delay }}"
  until: >-
    _mm_dep_patched.resources | length > 0 and
    (_mm_dep_patched.resources[0].status.readyReplicas | default(0)) >= 1

- name: Get Mattermost pod name after restart
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    label_selectors:
      - app=mattermost
  register: _mm_pods_restarted
  retries: 10
  delay: 5
  until: >-
    _mm_pods_restarted.resources | length > 0 and
    _mm_pods_restarted.resources[0].status.phase == 'Running'

- name: Update Mattermost pod name fact
  ansible.builtin.set_fact:
    _mattermost_pod_name: "{{ _mm_pods_restarted.resources[0].metadata.name }}"

# Pod restarted — wait for mmctl local socket to reappear before importing
- name: Wait for mmctl local mode to be available after pod restart
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: mmctl --local system version
  register: _mmctl_ready_post_restart
  retries: 15
  delay: 10
  until: _mmctl_ready_post_restart.return_code == 0
  changed_when: false

- name: Import Mattermost backup from ConfigMap mount via mmctl
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: mmctl --local import process --bypass-upload /mattermost/backup/backup.zip

- name: Wait for backup import job to complete
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: mmctl --local import job list
  register: _import_status
  retries: 12
  delay: 5
  until: "'pending' not in (_import_status.stdout | default(''))"
  changed_when: false

# The backup may contain an admin user with a different password.
# Reset to the desired password so subsequent tasks work reliably.
- name: Wait for import data to be fully committed
  ansible.builtin.pause:
    seconds: 30

- name: Reset admin password after import
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: mmctl --local user password admin {{ ocp4_workload_mattermost_admin_password }}

- name: Ensure automators team exists
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: >-
      mmctl --local team create
      --name automators
      --display-name "Automators"
  register: _team_create
  failed_when: >-
    _team_create.return_code != 0 and
    'already exists' not in (_team_create.stderr | default(''))

- name: Create ansibleadmin user
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: >-
      mmctl --local user create
      --email ansibleadmin@ansible.com
      --username ansibleadmin
      --password {{ ocp4_workload_mattermost_admin_password }}
      --system-admin
  register: _ansibleadmin_create
  failed_when: >-
    _ansibleadmin_create.return_code != 0 and
    'already exists' not in (_ansibleadmin_create.stderr | default(''))

- name: Add ansibleadmin to automators team
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: mmctl --local team add automators ansibleadmin@ansible.com

- name: Ensure town-square channel exists in automators team
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: >-
      mmctl --local channel create
      --team automators
      --name town-square
      --display-name "Town Square"
  register: _channel_create
  retries: 6
  delay: 10
  until: >-
    _channel_create.return_code == 0 or
    'already exists' in (_channel_create.stderr | default(''))
  failed_when: >-
    _channel_create.return_code != 0 and
    'already exists' not in (_channel_create.stderr | default(''))

- name: Create incoming webhook on town-square
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: >-
      mmctl --local webhook create-incoming
      --channel automators:town-square
      --user admin
      --display-name "Incoming Webhook"
      --lock-to-channel

- name: List webhooks
  kubernetes.core.k8s_exec:
    namespace: "{{ ocp4_workload_mattermost_namespace }}"
    pod: "{{ _mattermost_pod_name }}"
    command: mmctl --local webhook list
  register: _webhook_list

- name: Extract incoming webhook token
  ansible.builtin.set_fact:
    mattermost_incoming_token: "{{ _webhook_list.stdout | regex_search('\\((.*?)\\)', '\\1') | first }}"

- name: Show Mattermost deployment summary
  ansible.builtin.debug:
    msg:
      - "Mattermost URL:             {{ _mattermost_site_url }}"
      - "Admin username:             admin"
      - "Admin password:             {{ ocp4_workload_mattermost_admin_password }}"
      - "Incoming Webhook Token:     {{ mattermost_incoming_token }}"

- name: Share Mattermost access details via agnosticd_user_info
  agnosticd.core.agnosticd_user_info:
    msg: |
      Mattermost URL: {{ _mattermost_site_url }}
      Username: admin
      Password: {{ ocp4_workload_mattermost_admin_password }}
      Incoming Webhook Token: {{ mattermost_incoming_token }}
    data:
      mattermost_url: "{{ _mattermost_site_url }}"
      mattermost_username: admin
      mattermost_password: "{{ ocp4_workload_mattermost_admin_password }}"
      mattermost_webhook_token: "{{ mattermost_incoming_token }}"
