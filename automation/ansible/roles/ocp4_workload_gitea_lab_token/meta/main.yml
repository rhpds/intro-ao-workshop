---
galaxy_info:
  role_name: ocp4_workload_gitea_lab_token
  author: Roger Lopez
  description: >-
    Mints a Gitea personal access token for the lab user so AAP job templates can
    commit generated playbooks through the Gitea API. Runs after
    ocp4_workload_gitea_operator and publishes the token via agnosticd_user_info.
  license: Apache-2.0
  min_ansible_version: "2.14"

dependencies: []
