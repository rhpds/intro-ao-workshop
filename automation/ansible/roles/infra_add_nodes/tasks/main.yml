---
- name: Check required variables
  ansible.builtin.assert:
    that:
      - bastion_ansible_host is defined
      - bastion_ansible_user is defined
      - bastion_ansible_ssh_pass is defined
    quiet: true

- name: Add nodes to in-memory inventory
  ansible.builtin.add_host:
    name: "{{ item.1 }}"
    groups: "{{ item.0.groups }}"
    ansible_host: "{{ item.1 }}"
    ansible_port: 22
    ansible_user: "{{ item.0.user | default(infra_add_nodes_user) }}"
    ansible_ssh_pass: "{{ item.0.password | default(infra_add_nodes_password) }}"
    ansible_ssh_pipelining: true
    # ProxyCommand uses sshpass so the bastion password is passed programmatically.
    # ProxyJump cannot handle password auth for the proxy hop itself.
    # Format: sshpass -p <bastion_pass> ssh -W %h:%p <user>@<host> -p <port>
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      {{ '-o ProxyCommand="sshpass -p '
         ~ bastion_ansible_ssh_pass
         ~ ' ssh -W %h:%p'
         ~ ' -o StrictHostKeyChecking=no'
         ~ ' -o UserKnownHostsFile=/dev/null'
         ~ ' -p ' ~ (bastion_ansible_port | int | default(22))
         ~ ' ' ~ bastion_ansible_user
         ~ '@' ~ bastion_ansible_host ~ '"'
         if infra_add_nodes_use_bastion_proxy else '' }}
  with_subelements:
    - "{{ infra_add_nodes_hosts }}"
    - nodes
  loop_control:
    label: "{{ item.1 }} → groups={{ item.0.groups }}"

- name: Show nodes added to inventory
  ansible.builtin.debug:
    msg: "Added '{{ item.1 }}' to groups {{ item.0.groups }}"
  with_subelements:
    - "{{ infra_add_nodes_hosts }}"
    - nodes
  when: not silent | default(false)
