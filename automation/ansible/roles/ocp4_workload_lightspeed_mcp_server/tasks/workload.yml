---
# -------------------------------------------------------
# Namespace & RBAC
# -------------------------------------------------------
- name: Create Lightspeed MCP namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"

- name: Create Lightspeed MCP ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: lightspeed-mcp
        namespace: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"

# ghcr.io/redhatinsights/red-hat-lightspeed-mcp may run as a fixed non-root UID;
# anyuid allows it to start without OCP rejecting the security context.
- name: Grant anyuid SCC to Lightspeed MCP ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "lightspeed-mcp-anyuid-{{ ocp4_workload_lightspeed_mcp_server_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:anyuid
      subjects:
        - kind: ServiceAccount
          name: lightspeed-mcp
          namespace: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"

# -------------------------------------------------------
# Credentials Secret
# -------------------------------------------------------
- name: Create Lightspeed MCP credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: lightspeed-mcp-credentials
        namespace: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"
      type: Opaque
      stringData:
        LIGHTSPEED_CLIENT_ID: "{{ ocp4_workload_lightspeed_mcp_server_client_id }}"
        LIGHTSPEED_CLIENT_SECRET: "{{ ocp4_workload_lightspeed_mcp_server_client_secret }}"

# -------------------------------------------------------
# Auth gate config
# -------------------------------------------------------
# The MCP server itself has no auth, so without this gate the Route serves
# this account's Lightspeed data to anyone who knows the URL.
- name: Settle on the Lightspeed MCP gate bearer token
  ansible.builtin.set_fact:
    _lightspeed_gate_token: >-
      {{ ocp4_workload_lightspeed_mcp_server_bearer_token
         if ocp4_workload_lightspeed_mcp_server_bearer_token | length > 0
         else ocp4_workload_lightspeed_mcp_server_client_secret }}
  no_log: true

# Both inputs default to empty, which would render the gate password as the
# guessable literal "Bearer ". Fail loudly instead of standing up a weak gate.
- name: Require a usable Lightspeed MCP gate token
  ansible.builtin.assert:
    that:
      - _lightspeed_gate_token | default('', true) | trim | length >= 16
    fail_msg: >-
      The Lightspeed MCP auth gate has no usable token. Set
      ocp4_workload_lightspeed_mcp_server_client_secret (or override
      ocp4_workload_lightspeed_mcp_server_bearer_token).
    quiet: true

- name: Create Lightspeed MCP nginx config Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: lightspeed-mcp-nginx-conf
        namespace: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"
      type: Opaque
      stringData:
        default.conf: >-
          {{ lookup('file', role_path + '/files/nginx-default.conf.template')
             | replace('REPLACE_ME', _lightspeed_gate_token) }}
  no_log: true

# -------------------------------------------------------
# Deployment (stateless — no PVC required)
# -------------------------------------------------------
- name: Set Lightspeed MCP container args
  ansible.builtin.set_fact:
    _lightspeed_args: >-
      {{ ['--all-tools', 'http', '--host', '0.0.0.0']
         if ocp4_workload_lightspeed_mcp_server_all_tools | bool
         else ['http', '--host', '0.0.0.0'] }}

- name: Deploy Lightspeed MCP server
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: lightspeed-mcp
        namespace: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: lightspeed-mcp
        template:
          metadata:
            labels:
              app: lightspeed-mcp
          spec:
            serviceAccountName: lightspeed-mcp
            containers:
              - name: lightspeed-mcp
                image: "{{ ocp4_workload_lightspeed_mcp_server_image }}"
                args: "{{ _lightspeed_args }}"
                envFrom:
                  - secretRef:
                      name: lightspeed-mcp-credentials
                ports:
                  - containerPort: "{{ ocp4_workload_lightspeed_mcp_server_port }}"
                    name: mcp
                readinessProbe:
                  tcpSocket:
                    port: mcp
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 12
              # Sidecar rather than its own Deployment so it can proxy over localhost.
              - name: nginx
                image: "{{ ocp4_workload_lightspeed_mcp_server_gateway_image }}"
                ports:
                  - containerPort: "{{ ocp4_workload_lightspeed_mcp_server_gateway_port }}"
                    name: gw
                volumeMounts:
                  - name: nginx-conf
                    mountPath: /etc/nginx/conf.d/default.conf
                    subPath: default.conf
                    readOnly: true
                  - name: nginx-cache
                    mountPath: /var/cache/nginx
                  - name: nginx-run
                    mountPath: /tmp
                readinessProbe:
                  httpGet:
                    path: /healthz
                    port: gw
                  initialDelaySeconds: 5
                  periodSeconds: 10
                securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop: ["ALL"]
                  seccompProfile:
                    type: RuntimeDefault
            volumes:
              - name: nginx-conf
                secret:
                  secretName: lightspeed-mcp-nginx-conf
                  defaultMode: 288  # 0440
              - name: nginx-cache
                emptyDir: {}
              - name: nginx-run
                emptyDir: {}

# -------------------------------------------------------
# Service & Route
# -------------------------------------------------------
- name: Create Lightspeed MCP Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: lightspeed-mcp
        namespace: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"
      spec:
        selector:
          app: lightspeed-mcp
        ports:
          - name: mcp
            port: "{{ ocp4_workload_lightspeed_mcp_server_port }}"
            targetPort: mcp

# Separate Service so the Route can reach the gate while the bare one above
# stays open to in-cluster callers such as the CVE fetch-and-commit job.
- name: Create Lightspeed MCP gateway Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: lightspeed-mcp-gw
        namespace: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"
      spec:
        selector:
          app: lightspeed-mcp
        ports:
          - name: gw
            port: "{{ ocp4_workload_lightspeed_mcp_server_gateway_port }}"
            targetPort: gw

- name: Create Lightspeed MCP Route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: lightspeed-mcp
        namespace: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"
      spec:
        to:
          kind: Service
          name: lightspeed-mcp-gw
        port:
          targetPort: gw
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect

# -------------------------------------------------------
# Health check
# -------------------------------------------------------
- name: Wait for Lightspeed MCP Deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: lightspeed-mcp
    namespace: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"
  register: _lightspeed_deployment
  retries: "{{ ocp4_workload_lightspeed_mcp_server_wait_retries }}"
  delay: "{{ ocp4_workload_lightspeed_mcp_server_wait_delay }}"
  failed_when: false
  until: >-
    _lightspeed_deployment.resources | default([]) | length > 0 and
    (_lightspeed_deployment.resources[0].status.readyReplicas | default(0)) >= 1

- name: Get Lightspeed MCP Route hostname
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: lightspeed-mcp
    namespace: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"
  register: _lightspeed_route

- name: Set Lightspeed MCP endpoint URL fact
  ansible.builtin.set_fact:
    lightspeed_mcp_endpoint: "https://{{ _lightspeed_route.resources[0].spec.host }}/mcp"

- name: Show Lightspeed MCP deployment summary
  ansible.builtin.debug:
    msg:
      - "Lightspeed MCP endpoint:  {{ lightspeed_mcp_endpoint }}"
      - "All tools enabled:        {{ ocp4_workload_lightspeed_mcp_server_all_tools }}"

- name: Share Lightspeed MCP access details via agnosticd_user_info
  agnosticd.core.agnosticd_user_info:
    msg: |
      Lightspeed MCP endpoint: {{ lightspeed_mcp_endpoint }}
      All tools enabled: {{ ocp4_workload_lightspeed_mcp_server_all_tools }}
    data:
      lightspeed_mcp_endpoint: "{{ lightspeed_mcp_endpoint }}"
