---
- name: Remove Lightspeed MCP namespace (deletes all namespaced resources)
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp4_workload_lightspeed_mcp_server_namespace }}"

- name: Remove anyuid ClusterRoleBinding for Lightspeed MCP ServiceAccount
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "lightspeed-mcp-anyuid-{{ ocp4_workload_lightspeed_mcp_server_namespace }}"
