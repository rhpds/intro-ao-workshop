---
# Configure AO network access — env vars required for AO to communicate
# with AAP on private/cluster-internal networks.
#
# APP_OIDC_ALLOW_PRIVATE_NETWORKS — lets the backend fetch OIDC discovery
# and JWKS from RFC1918/cluster addresses. Required when AAP lives on an
# internal OpenShift Route.
#
# APP_INTEGRATION_URL_ALLOWED_HOSTS — outbound integration URL allowlist.
# Must be set on backend, worker, AND background-worker independently.
#
# Approach mirrors ansible/product-demos infrastructure/ao/network-access.yml:
# fetch deployments first to get the real container name, then loop with
# strategic-merge so operator-managed vars are preserved.
#
# Reference: https://github.com/lennysh/cheat-sheets/tree/main/automation-orchestrator

- name: Get Automation Orchestrator Route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ ocp4_workload_automation_orchestrator_name }}"
    namespace: "{{ ocp4_workload_automation_orchestrator_namespace }}"
  register: r_ao_route
  until: r_ao_route.resources | default([]) | length > 0
  retries: 10
  delay: 6

- name: Get backend, worker, and background-worker Deployments
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ ocp4_workload_automation_orchestrator_namespace }}"
  register: r_ao_deployments
  until: r_ao_deployments.resources | default([]) | length > 0
  retries: 10
  delay: 6
  loop:
    - "{{ ocp4_workload_automation_orchestrator_name }}-backend"
    - "{{ ocp4_workload_automation_orchestrator_name }}-worker"
    - "{{ ocp4_workload_automation_orchestrator_name }}-background-worker"

- name: Build integration URL allowlist
  ansible.builtin.set_fact:
    _ocp4_workload_automation_orchestrator_allowed_hosts: >-
      {{ ([r_ao_route.resources[0].spec.host]
          + ([ocp4_workload_automation_orchestrator_aap_hostname
              | ansible.builtin.urlsplit('hostname')]
             if ocp4_workload_automation_orchestrator_aap_hostname | length > 0
             else []))
         | unique | list }}

- name: Patch backend, worker, background-worker with env vars
  kubernetes.core.k8s:
    state: patched
    merge_type: strategic-merge
    api_version: apps/v1
    kind: Deployment
    name: "{{ item.metadata.name }}"
    namespace: "{{ ocp4_workload_automation_orchestrator_namespace }}"
    definition:
      spec:
        template:
          spec:
            containers:
              - name: "{{ item.spec.template.spec.containers[0].name }}"
                env: >-
                  {{ [{'name': 'APP_INTEGRATION_URL_ALLOWED_HOSTS',
                        'value': _ocp4_workload_automation_orchestrator_allowed_hosts | to_json}]
                     + ([{'name': 'APP_OIDC_ALLOW_PRIVATE_NETWORKS', 'value': ocp4_workload_automation_orchestrator_oidc_allow_private_networks}]
                        if item.metadata.name == ocp4_workload_automation_orchestrator_name ~ '-backend'
                        else []) }}
  notify: restart remaining ao deployments
  loop: "{{ r_ao_deployments.results | map(attribute='resources') | flatten }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Show configured allowlist
  ansible.builtin.debug:
    msg: "APP_INTEGRATION_URL_ALLOWED_HOSTS: {{ _ocp4_workload_automation_orchestrator_allowed_hosts }}"
