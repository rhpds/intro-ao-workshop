---
- name: Install Automation Orchestrator operator
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: install
    install_operator_name: automation-orchestrator-operator
    install_operator_namespace: "{{ ocp4_workload_automation_orchestrator_namespace }}"
    install_operator_channel: "{{ ocp4_workload_automation_orchestrator_channel }}"
    install_operator_automatic_install_plan_approval: >-
      {{ ocp4_workload_automation_orchestrator_automatic_install_plan_approval }}
    install_operator_starting_csv: "{{ ocp4_workload_automation_orchestrator_starting_csv }}"
    install_operator_catalogsource_setup: false
    install_operator_catalog: redhat-operators
    install_operator_catalog_namespace: openshift-marketplace

- name: Set ingress host from hostname override
  when: ocp4_workload_automation_orchestrator_ingress_hostname | length > 0
  ansible.builtin.set_fact:
    _ocp4_workload_automation_orchestrator_ingress_host: >-
      {{ ocp4_workload_automation_orchestrator_ingress_hostname }}.{{ openshift_cluster_ingress_domain }}

- name: Set ingress host from instance name
  when: ocp4_workload_automation_orchestrator_ingress_hostname | length == 0
  ansible.builtin.set_fact:
    _ocp4_workload_automation_orchestrator_ingress_host: >-
      {{ ocp4_workload_automation_orchestrator_name }}.{{ openshift_cluster_ingress_domain }}
