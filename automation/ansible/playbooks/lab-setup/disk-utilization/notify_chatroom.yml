---
- name: Notify Mattermost chatroom
  # Shared by the disk utilization workflow and by the Hello World
  # workflow in module 03, which is why disk_tier selects the card
  # rather than the playbook assuming one.
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Apply defaults
      ansible.builtin.set_fact:
        notify_host: "{{ notify_host | default('unknown') | string }}"
        disk_mount: "{{ disk_mount | default('unknown') | string }}"
        disk_use_percent: "{{ disk_use_percent | default('unknown') | string }}"
        disk_tier: "{{ disk_tier | default('unknown') | string | trim | lower }}"
        remediation_action: "{{ remediation_action | default('unknown') | string }}"
        dnf_cache_removed: "{{ dnf_cache_removed | default('unknown') | string }}"
        log_archives_removed: "{{ log_archives_removed | default('unknown') | string }}"
        # Needed by tasks/notify/warn.yml. Defaulted here as well as
        # passed by the workflow, because an undefined variable in a
        # tier template drops the whole include into the rescue below
        # and posts "Unsupported Disk Tier" over a correctly routed run.
        large_logs_removed: "{{ large_logs_removed | default('unknown') | string }}"
        large_logs_freed_mb: "{{ large_logs_freed_mb | default('unknown') | string }}"
        large_log_threshold_mb: "{{ large_log_threshold_mb | default('100') | string }}"
        disk_use_percent_before: "{{ disk_use_percent_before | default(disk_use_percent | default('unknown')) | string }}"
        disk_use_percent_after: "{{ disk_use_percent_after | default('unknown') | string }}"
        total_reclaimed_mb: "{{ total_reclaimed_mb | default('unknown') | string }}"
        dnf_cache_freed_mb: "{{ dnf_cache_freed_mb | default('unknown') | string }}"
        logs_freed_mb: "{{ logs_freed_mb | default('unknown') | string }}"
        log_retention_days: "{{ log_retention_days | default('90') | string }}"
        dry_run: "{{ dry_run | default(false) | bool }}"
        disk_expand_gb: "{{ disk_expand_gb | default('unknown') | string }}"
        volume_size_before_gb: "{{ volume_size_before_gb | default('unknown') | string }}"
        volume_size_after_gb: "{{ volume_size_after_gb | default('unknown') | string }}"
        # Needed by tasks/notify/hello.yml, where module 03 wires both
        # from a task agent's answer. Defaulted for the same reason as
        # large_logs_removed above: an agent that returns nothing would
        # otherwise take the include into the rescue and post an
        # unsupported-tier card over a workflow that ran correctly.
        notify_title: "{{ notify_title | default('Hello World') | string }}"
        notify_text: "{{ notify_text | default('The task agent returned no message.') | string }}"

    - name: Include notification template for disk tier
      block:
        - name: Include tier-specific notification template
          ansible.builtin.include_tasks: "tasks/notify/{{ disk_tier }}.yml"
      rescue:
        - name: Include unsupported notification template
          ansible.builtin.include_tasks: tasks/notify/unsupported.yml
        - name: Show notify template resolution
          # The reason matters as much as the fallback: this rescue
          # catches a missing tier file and an undefined variable
          # *inside* an existing one alike, and the two look identical
          # on the chatroom card.
          ansible.builtin.debug:
            msg: >-
              Could not render tasks/notify/{{ disk_tier }}.yml
              (disk_tier={{ disk_tier | quote }}) — using unsupported.
              Reason: {{ ansible_failed_result.msg | default('unknown') }}

    - name: Send notification message via Mattermost
      community.general.mattermost:
        url: "{{ mattermost_url }}"
        api_key: "{{ api_chat_token }}"
        attachments: "{{ mattermost_attachments }}"
      delegate_to: localhost
