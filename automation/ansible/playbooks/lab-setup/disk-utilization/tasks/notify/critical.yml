---
- name: Build Mattermost attachment (critical — disk expanded, check mode)
  ansible.builtin.set_fact:
    mattermost_attachments:
      - text: >-
          [check mode] {{ notify_host }}: would grow the root volume backing {{ disk_mount }}
          (currently {{ disk_use_percent_before }}% full).
        color: '#9b59b6'
        title: Critical — Disk Expanded (Check Mode)
        fields:
          - title: Action
            value: Would grow the root partition and expand the filesystem
            short: false
          - title: Volume Before
            value: "{{ volume_size_before_gb }} GiB"
            short: true
          - title: Volume After
            value: "{{ volume_size_after_gb }} GiB"
            short: true
          - title: Would Add
            value: "{{ disk_expand_gb }} GiB"
            short: true
  when: dry_run | default(false) | bool

- name: Build Mattermost attachment (critical — disk expanded)
  ansible.builtin.set_fact:
    mattermost_attachments:
      - text: >-
          {{ notify_host }}: grew the root volume backing {{ disk_mount }}
          (usage {{ disk_use_percent_before }}% → {{ disk_use_percent_after }}%,
          same data over a larger volume — nothing was deleted).
        color: '#9b59b6'
        title: Critical — Disk Expanded
        fields:
          - title: Action
            value: Grow the root partition and expand the filesystem
            short: false
          - title: Volume Before
            value: "{{ volume_size_before_gb }} GiB"
            short: true
          - title: Volume After
            value: "{{ volume_size_after_gb }} GiB"
            short: true
          - title: Added
            value: "{{ disk_expand_gb }} GiB"
            short: true
  when: not (dry_run | default(false) | bool)
