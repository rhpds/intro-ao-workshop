---
# Module 03, Hello World. The only tier whose card carries no disk
# figures: the student's workflow is a trigger, a task agent and this
# job template, and both lines on the card come from the agent's
# answer. Every field the other tiers fill from a df would read
# "unknown" here, so this card has none, which also keeps the first
# workflow a student builds down to two things they wired themselves.
- name: Build Mattermost attachment (hello world)
  ansible.builtin.set_fact:
    mattermost_attachments:
      # notify_text is whatever the model said, so it has no length
      # the student can predict: a chatty answer to "say hello" runs to
      # paragraphs and turns the card into a wall. The title stays the
      # student's own, set in extra_vars rather than by the agent.
      - text: "{{ notify_text | truncate(600) }}"
        color: '#3498db'
        title: "{{ notify_title }}"
