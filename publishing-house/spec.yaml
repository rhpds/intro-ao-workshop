project:
  slug: "intro-ao-workshop"
  owner_email: "rlopez@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "ansible"
  description: "A hands on lab introducing the Ansible Automation Orchestrator (AO), the add-on to Ansible Automation Platform that unifies task-based, event-driven, and AI-driven automation into a single visual workflow experience. Participants build workflows on a drag-and-drop canvas using AAP job template nodes, AI-powered task nodes, approval gates, conditional/switch routing, MCP integrations, and Event Driven Ansible triggers. The lab is needed because AO is a new capability and practitioners need guided experience connecting it to the AAP foundation they already use."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1066"
  workflow_id: "c927b983-10a6-41ed-be21-fea44dd4d8e0"

spec:
  title: "Introduction to Ansible Automation Orchestrator"
  learning_objectives: []
  modules:
  - id: module-01
    title: "Overview and Interface Tour"
    duration_min: 20
    status: not_started
  - id: module-02
    title: "Set Up Integrations and Credentials"
    duration_min: 20
    status: not_started
  - id: module-03
    title: "Build the Workflow"
    duration_min: 40
    status: not_started
  - id: module-04
    title: "Run and Monitor"
    duration_min: 20
    status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"                # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "sno"                # sno | multinode — only for platform = ocp
    control_plane_instance_count: 1    # 1 if sno, 3 if multinode
    control_plane_cpu: 32              # 32 if sno, 16 if multinode
    control_plane_ram_gb: 128          # 128 if sno, 64 if multinode
    worker_count: 0                    # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: "2.7"                 # required if AAP in products
    ai_requirement: "maas"             # maas | gpu | none
    ai_model_tier: "open-source"       # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services:
      - "quay.io"
      - "registry.redhat.io"
      - "RHDP MaaS endpoint"
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2
  audience: "beginner"               # beginner | intermediate | advanced

development:
  automation:
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "This lab addresses the need for practitioners to gain hands-on experience with Ansible Automation Orchestrator (AO), Red Hat's new add-on to AAP that unifies task-based, event-driven, and AI-driven automation on a single visual canvas. Targeting beginner sysadmins and automation engineers who already have basic AAP awareness, participants build a complete incident triage workflow end-to-end — configuring integrations, composing nodes on the AO canvas, and monitoring execution — without writing a single playbook."
    module_summaries:
      - title: "Overview and Interface Tour"
        overview: "Participants log in to the pre-deployed AO environment and orient themselves to the interface — exploring the workflow canvas, node palette, and monitoring view. No configuration is performed; the goal is familiarity with where things are."
      - title: "Set Up Integrations and Credentials"
        overview: "Participants create the credentials and integrations needed for the lab workflow: an AAP credential, an MCP server integration, and an LLM provider connection to the pre-deployed MaaS endpoint."
      - title: "Build the Workflow"
        overview: "Participants assemble a complete incident triage workflow on the AO canvas, placing and connecting seven node types — a webhook trigger, AI triage agent, approval gate, switch node, AAP job template node, and resolution node — and reviewing the finished graph."
      - title: "Run and Monitor"
        overview: "Participants trigger the completed workflow via webhook, watch real-time node-by-node execution, action the approval gate, and inspect final outputs to confirm the incident was detected, triaged, approved, and remediated."
    rcars_overlap_pct: 82
    rcars_top_matches:
      - title: "Event-Driven Ansible Controller Up and Running 2.5"
        ci_name: "zt-ansiblebu.zt-ans-bu-eda-controller.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-bu-eda-controller.prod"
        relevance_score: 82
        why_it_fits: "Covers EDA Controller configuration, rulebook activations, and integration between Automation Decisions and Automation Execution — overlaps with the EDA/webhook portions of this lab."
      - title: "Ansible Automation Platform Roadshow 03 - Operational Efficiency"
        ci_name: "zt-ansiblebu.zt-ans-bu-roadshow03.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-bu-roadshow03.prod"
        relevance_score: 74
        why_it_fits: "Covers EDA configuration and human-in-the-loop approval workflows, aligning with Modules 3 and 4."
      - title: "Introduction to Ansible Automation Controller 2.7"
        ci_name: "zt-ansiblebu.zt-ans-bu-intro-controller-aap25.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-bu-intro-controller-aap25.prod"
        relevance_score: 64
        why_it_fits: "Covers AAP 2.7 Workflow Job Templates with conditional logic and the Workflow Visualizer."
    catalog_gap: "The existing catalog has strong EDA labs and AAP Controller workflow content separately, plus Ansible Product Demos as a presenter-led option, but no beginner-level hands-on lab that combines AO's visual canvas, AI triage nodes, MCP integrations, and EDA webhook triggers into a single end-to-end workflow on AAP 2.7. This lab fills that gap."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
