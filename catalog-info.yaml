apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: intro-ao-workshop
  title: intro-ao-workshop
  description: A hands on lab introducing the Ansible Automation Orchestrator (AO),
    the add-on to Ansible Automation Platform that unifies task-based, event-driven,
    and AI-driven automation into a single visual workflow experience. Participants
    build workflows on a drag-and-drop canvas using AAP job template nodes, AI-powered
    task nodes, approval gates, conditional/switch routing, MCP integrations, and
    Event Driven Ansible triggers. The lab is needed because AO is a new capability
    and practitioners need guided experience connecting it to the AAP foundation they
    already use.
