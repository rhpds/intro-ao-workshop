---
site:
  title: Introduction to automation orchestrator
  url: https://rhpds.github.io/intro-ao-workshop
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      branches: HEAD
      start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v2.0.3/ui-bundle.zip
    snapshot: true
  # rh1-2027/account.yaml sets the navbar logo to "rh1", but the theme ships
  # no img/logo-rh1.svg, so the header would request a missing asset and show
  # a broken image with the "Red Hat Demo Platform" alt text. Dropping a copy
  # of the theme's own logo in here satisfies that request for this lab only.
  supplemental_files: ./supplemental-ui

antora:
  extensions:
    - require: '@sntke/antora-mermaid-extension'
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs
      script_stem: header-scripts
      mermaid_initialize_options:
        start_on_load: true
    - require: '@andrew-jones/antora-tabs-extension'

output:
  dir: ./www
