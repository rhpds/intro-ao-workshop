---
# Service availability and supplied-credential checks only. No workflows run.
# Logging is enabled: treat output as sensitive.
- name: Environment Health Check
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/services.yml
  tasks:
    - name: Check service endpoints and provided credentials
      ansible.builtin.include_tasks: tasks/services.yml

    - name: Report health check results
      ansible.builtin.debug:
        msg:
          passed: "{{ healthcheck_passed }}"
          failed: "{{ healthcheck_failed }}"

    - name: Require every requested service check to pass
      ansible.builtin.assert:
        that: healthcheck_failed | length == 0
        fail_msg: "Checks failed or not validated: {{ healthcheck_failed | join('; ') }}"
        success_msg: Service availability and supplied credentials verified. No end-to-end workflows were executed.
