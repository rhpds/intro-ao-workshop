---
- name: Preflight | Log in to Mattermost using provided credentials
  ansible.builtin.uri:
    url: "{{ mattermost_url }}/api/v4/users/login"
    method: POST
    body_format: json
    body: {login_id: "{{ mattermost_username }}", password: "{{ mattermost_password }}"}
    timeout: "{{ healthcheck_timeout }}"
    validate_certs: "{{ healthcheck_validate_certs }}"
    follow_redirects: none
  register: e2e_chat_login

- name: Preflight | Require Mattermost session token
  ansible.builtin.assert:
    that: e2e_chat_login.token | default('') | length > 0
    quiet: true

- name: Preflight | Record Mattermost session headers
  ansible.builtin.set_fact:
    e2e_chat_headers: {Authorization: "Bearer {{ e2e_chat_login.token }}"}

- name: Preflight | List Mattermost teams
  ansible.builtin.uri:
    url: "{{ mattermost_url }}/api/v4/users/me/teams"
    headers: "{{ e2e_chat_headers }}"
    timeout: "{{ healthcheck_timeout }}"
    validate_certs: "{{ healthcheck_validate_certs }}"
    follow_redirects: none
  register: e2e_chat_teams

- name: Preflight | Select notification team
  ansible.builtin.set_fact:
    e2e_chat_selected_teams: "{{ (e2e_chat_teams.json | selectattr('name', 'equalto', e2e_mattermost_team) | list) if e2e_mattermost_team | length > 0 else e2e_chat_teams.json }}"

- name: Preflight | Require a unique team
  ansible.builtin.assert:
    that: e2e_chat_selected_teams | length == 1
    fail_msg: Set e2e_mattermost_team when the user belongs to multiple teams.
    quiet: true

- name: Preflight | Resolve Town Square channel
  ansible.builtin.uri:
    url: "{{ mattermost_url }}/api/v4/teams/{{ e2e_chat_selected_teams[0].id }}/channels/name/{{ e2e_mattermost_channel | urlencode }}"
    headers: "{{ e2e_chat_headers }}"
    timeout: "{{ healthcheck_timeout }}"
    validate_certs: "{{ healthcheck_validate_certs }}"
    follow_redirects: none
  register: e2e_chat_channel_response

- name: Preflight | Record notification channel
  ansible.builtin.set_fact:
    e2e_chat_channel: "{{ e2e_chat_channel_response.json.id }}"
