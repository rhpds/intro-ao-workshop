---
- name: Initialize paginated AO collection
  ansible.builtin.set_fact:
    hc_ao_resources: []
    hc_ao_cursor: ''
    hc_ao_more: true
    hc_ao_page_count: 0
  no_log: true

- name: Read bounded AO collection pages
  ansible.builtin.include_tasks: ao-collection-page.yml

- name: Reject an incomplete collection
  ansible.builtin.assert:
    that: not hc_ao_more | bool
    fail_msg: AO collection exceeded the 50-page safety limit.

- name: Save complete AO collection
  ansible.builtin.set_fact:
    "{{ hc_collection_register }}":
      json:
        resources: "{{ hc_ao_resources }}"
  no_log: true
