---
- name: Verify Splunk availability and supplied login
  block:
    - name: Require Splunk credentials and URL
      ansible.builtin.assert:
        that:
          - splunk_url is match('^https?://[^/]+')
          - splunk_username | length > 0
          - splunk_password | length > 0
          - splunk_password is not match('^(REPLACE_|YOUR_|<Change Me>)')
        quiet: true

    - name: Read Splunk Web login page and CSRF cookies
      ansible.builtin.uri:
        url: "{{ splunk_url }}/en-US/account/login"
        return_content: true
        timeout: "{{ healthcheck_timeout }}"
        validate_certs: "{{ healthcheck_validate_certs }}"
        follow_redirects: none
      register: hc_splunk_login
      changed_when: false

    - name: Authenticate against explicit Splunk management API
      ansible.builtin.uri:
        url: "{{ splunk_api_url | regex_replace('/+$', '') }}/services/authentication/current-context?output_mode=json"
        url_username: "{{ splunk_username }}"
        url_password: "{{ splunk_password }}"
        force_basic_auth: true
        timeout: "{{ healthcheck_timeout }}"
        validate_certs: "{{ healthcheck_validate_certs }}"
        follow_redirects: none
      register: hc_splunk_management
      changed_when: false
      when: splunk_api_url | length > 0

    - name: Verify Splunk management authentication response
      ansible.builtin.assert:
        that: hc_splunk_management.json.entry | default([]) | length > 0
        quiet: true
      when: splunk_api_url | length > 0

    - name: Authenticate using Splunk Web when no management endpoint is provided
      ansible.builtin.uri:
        url: "{{ splunk_url }}/en-US/account/login"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ splunk_username }}"
          password: "{{ splunk_password }}"
          cval: "{{ hc_splunk_login.cookies.cval | default('') }}"
          return_to: /en-US/
        headers:
          Cookie: "{{ hc_splunk_login.cookies_string | default('') }}"
        return_content: true
        timeout: "{{ healthcheck_timeout }}"
        validate_certs: "{{ healthcheck_validate_certs }}"
        follow_redirects: none
      register: hc_splunk_web_auth
      changed_when: false
      when: splunk_api_url | length == 0

    - name: Require successful Splunk Web login
      ansible.builtin.assert:
        that:
          - hc_splunk_web_auth.json.status is defined
          - hc_splunk_web_auth.json.status == 0
        quiet: true
      when: splunk_api_url | length == 0

    - name: Preserve cookies from both Splunk Web login requests
      ansible.builtin.set_fact:
        hc_splunk_cookies: "{{ hc_splunk_login.cookies | default({}) | combine(hc_splunk_web_auth.cookies | default({})) }}"
      when: splunk_api_url | length == 0

    - name: Verify authenticated user context through the Splunk Web proxy
      ansible.builtin.uri:
        url: "{{ splunk_url }}{{ splunk_web_context_path }}"
        headers:
          Cookie: "{% for key, value in hc_splunk_cookies.items() %}{{ key }}={{ value }}{{ '; ' if not loop.last else '' }}{% endfor %}"
        timeout: "{{ healthcheck_timeout }}"
        validate_certs: "{{ healthcheck_validate_certs }}"
        follow_redirects: none
      register: hc_splunk_web_context
      changed_when: false
      when: splunk_api_url | length == 0

    - name: Require the supplied Splunk user's authenticated context
      ansible.builtin.assert:
        that:
          - hc_splunk_web_context.json.entry | default([]) | length > 0
          - hc_splunk_web_context.json.entry[0].content.username == splunk_username
        quiet: true
      when: splunk_api_url | length == 0

    - name: Record Splunk success
      ansible.builtin.set_fact:
        healthcheck_passed: "{{ healthcheck_passed + ['Splunk availability and credentials'] }}"
  rescue:
    - name: Record Splunk failure
      ansible.builtin.set_fact:
        healthcheck_failed: "{{ healthcheck_failed + ['Splunk availability and credentials (failed at: ' ~ ansible_failed_task.name ~ ')'] }}"
  always:
    - name: Report Splunk outcome
      ansible.builtin.debug:
        msg: "{{ 'PASS' if 'Splunk availability and credentials' in healthcheck_passed else 'FAIL' }} — Splunk availability and credentials"
